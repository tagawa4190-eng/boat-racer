<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BOAT RACER v15</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061722;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
#start{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(#78d9f1,#087da8);color:#fff;text-align:center}
.card{width:min(90vw,560px);padding:26px 28px;border-radius:24px;background:rgba(3,28,43,.92);border:1px solid #ffffff28;box-shadow:0 18px 50px #0006}
.card h1{margin:0 0 6px;font-size:clamp(36px,6vw,58px)}.card h2{margin:0 0 12px}.card p{margin:0 0 20px;line-height:1.6}.card button{padding:15px 30px;border:0;border-radius:13px;background:#fff;color:#075d7a;font-size:21px;font-weight:900}
#ui{display:none;position:fixed;inset:0;color:#fff;pointer-events:none;text-shadow:0 2px 5px #001923}
#top{position:absolute;top:7px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.badge{padding:6px 10px;border-radius:9px;background:#052337aa;border:1px solid #ffffff2a;font-size:12px;font-weight:900;white-space:nowrap}
#reset{position:absolute;right:9px;top:8px;border:0;border-radius:10px;padding:9px 11px;background:#fffffff2;color:#06485f;font-weight:900;pointer-events:auto}
#speedbox{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);min-width:165px;padding:7px 14px;text-align:center;border-radius:14px;background:#031c2bdf;border:1px solid #ffffff2b}
#speed{font-size:36px;font-weight:950;line-height:1}#speed small{font-size:15px;margin-left:5px}#state{font-size:11px;margin-top:5px;font-weight:900}
#distance{position:absolute;left:50%;top:45px;transform:translateX(-50%);padding:5px 9px;border-radius:8px;background:#0523378c;font-size:11px;font-weight:800}
#throttle{position:absolute;left:8px;top:22%;width:108px;height:56%;pointer-events:auto}#tlab{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900}#ttrack{position:absolute;left:50%;top:0;bottom:0;width:18px;transform:translateX(-50%);border:2px solid #fff;border-radius:12px;background:#06213399}#tfill{position:absolute;left:50%;bottom:0;width:8px;height:0;transform:translateX(-50%);border-radius:8px;background:#7ce6f8;box-shadow:0 0 12px #7ce6f8}#tknob{position:absolute;left:50%;bottom:0;width:66px;height:38px;transform:translate(-50%,50%);border:4px solid #37434a;border-radius:9px;background:#eee}
#steer{position:absolute;right:8px;bottom:14px;width:min(38vw,350px);height:130px;pointer-events:auto}#slab{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;white-space:nowrap}#strack{position:absolute;left:0;right:0;top:67px;height:18px;border:2px solid #fff;border-radius:12px;background:#06213399}#sknob{position:absolute;left:50%;top:76px;width:62px;height:62px;transform:translate(-50%,-50%);border:5px solid #37434a;border-radius:50%;background:#eee}
#portrait{display:none;position:fixed;z-index:100;inset:0;align-items:center;justify-content:center;background:#071822;color:#fff;font-size:22px}@media(orientation:portrait){#portrait{display:flex}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="start"><div class="card">
<h1>🚤 BOAT RACER</h1>
<h2>操作テスト v15</h2>
<p>300mスケールの競走水面。<br>ボート＆ターンマークをリアル寄りに更新。</p>
<button id="go">スタート</button>
</div></div>

<div id="ui">
<div id="top">
<div class="badge">BOAT RACER v15</div>
<div class="badge">下→　右↑　上←　左↓</div>
</div>
<div id="distance">1M ↔ 2M：300m</div>
<button id="reset">リセット</button>

<div id="speedbox">
<div id="speed">0.0<small>km/h</small></div>
<div id="state">舵：中央</div>
</div>

<div id="throttle">
<div id="tlab">アクセル</div>
<div id="ttrack"></div>
<div id="tfill"></div>
<div id="tknob"></div>
</div>

<div id="steer">
<div id="slab">← 左　ハンドル　右 →</div>
<div id="strack"></div>
<div id="sknob"></div>
</div>
</div>

<div id="portrait">📱 iPhoneを横向きにしてプレイ</div>

<script>
"use strict";

const $=id=>document.getElementById(id);
const cv=$("game");
const ctx=cv.getContext("2d");

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const damp=(k,dt)=>1-Math.exp(-k*dt);

function lerpAngle(a,b,t){
  return a+Math.atan2(Math.sin(b-a),Math.cos(b-a))*t;
}

let W=innerWidth;
let H=innerHeight;
let DPR=1;
let last=performance.now();
let clock=0;

let running=false;
let throttle=0;
let steering=0;

const WORLD={w:520,h:190};

const COURSE={
  leftX:110,
  rightX:410,
  centerY:95,
  bottomY:137,
  topY:53,
  turnRadius:42
};

const marks=[
  {x:COURSE.leftX,y:COURSE.centerY,r:.55},
  {x:COURSE.rightX,y:COURSE.centerY,r:.55}
];

const boat={
  x:55,
  y:COURSE.bottomY,
  angle:0,
  vx:0,
  vy:0,
  yaw:0,
  speedCommand:0,
  r:1.25
};

const camera={
  x:boat.x,
  y:boat.y,
  angle:boat.angle,
  roll:0,
  bob:0,
  shakeX:0,
  shakeY:0
};

function resize(){
  W=innerWidth;
  H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,2);

  cv.width=Math.round(W*DPR);
  cv.height=Math.round(H*DPR);

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();

function resetBoat(){
  throttle=0;
  steering=0;

  Object.assign(boat,{
    x:55,
    y:COURSE.bottomY,
    angle:0,
    vx:0,
    vy:0,
    yaw:0,
    speedCommand:0
  });

  Object.assign(camera,{
    x:boat.x,
    y:boat.y,
    angle:boat.angle,
    roll:0,
    bob:0,
    shakeX:0,
    shakeY:0
  });

  $("tknob").style.bottom="0%";
  $("tfill").style.height="0%";
  $("sknob").style.left="50%";
  $("speed").innerHTML='0.0<small>km/h</small>';
  $("state").textContent="舵：中央";
}

$("go").onclick=()=>{
  $("start").style.display="none";
  $("ui").style.display="block";
  running=true;
  last=performance.now();
  resetBoat();
};

$("reset").onclick=resetBoat;

const ta=$("throttle");
const sa=$("steer");

function setThrottle(y){
  const r=ta.getBoundingClientRect();

  throttle=clamp(
    1-(y-r.top)/r.height,
    0,
    1
  );

  $("tknob").style.bottom=(throttle*100)+"%";
  $("tfill").style.height=(throttle*100)+"%";
}

function setSteering(px){
  const r=sa.getBoundingClientRect();

  steering=clamp(
    (((px-r.left)/r.width)-.5)*2,
    -1,
    1
  );

  $("sknob").style.left=(50+steering*45)+"%";

  $("state").textContent=
    steering<-.08
    ?"舵：左 ←"
    :steering>.08
    ?"舵：右 →"
    :"舵：中央";
}

function centerSteering(){
  steering=0;
  $("sknob").style.left="50%";
  $("state").textContent="舵：中央";
}

ta.onpointerdown=e=>{
  ta.setPointerCapture(e.pointerId);
  setThrottle(e.clientY);
};

ta.onpointermove=e=>{
  if(e.buttons||e.pointerType==="touch"){
    setThrottle(e.clientY);
  }
};

sa.onpointerdown=e=>{
  sa.setPointerCapture(e.pointerId);
  setSteering(e.clientX);
};

sa.onpointermove=e=>{
  if(e.buttons||e.pointerType==="touch"){
    setSteering(e.clientX);
  }
};

sa.onpointerup=centerSteering;
sa.onpointercancel=centerSteering;

function collideMark(m){
  const dx=boat.x-m.x;
  const dy=boat.y-m.y;
  const d=Math.hypot(dx,dy);
  const min=boat.r+m.r;

  if(d>=min)return;

  const nx=
    d>.0001
    ?dx/d
    :-Math.cos(boat.angle);

  const ny=
    d>.0001
    ?dy/d
    :-Math.sin(boat.angle);

  boat.x=m.x+nx*min;
  boat.y=m.y+ny*min;

  const vn=
    boat.vx*nx+
    boat.vy*ny;

  if(vn<0){
    boat.vx-=vn*nx;
    boat.vy-=vn*ny;
  }

  boat.vx*=.34;
  boat.vy*=.34;
  boat.speedCommand*=.45;
  boat.yaw*=.45;
}

function physics(dt){
  if(!running)return;

  const MAX=22.22;

  const targetSpeed=
    throttle*
    MAX;

  const response=
    targetSpeed>
    boat.speedCommand
    ?.62
    :1.65;

  boat.speedCommand+=
    (targetSpeed-boat.speedCommand)*
    Math.min(
      1,
      response*dt
    );

  const speedRatio=
    clamp(
      boat.speedCommand/MAX,
      0,
      1
    );

  const steerAbs=
    Math.abs(
      steering
    );

  const targetYaw=
    steering*
    (.13+.42*speedRatio);

  const yawResponse=
    steerAbs<.02
    ?3.6
    :2.35;

  boat.yaw+=
    (targetYaw-boat.yaw)*
    Math.min(
      1,
      yawResponse*dt
    );

  if(steerAbs<.02){
    boat.yaw*=
      Math.pow(
        .28,
        dt
      );
  }

  boat.angle+=
    boat.yaw*
    dt;

  const turnLoss=
    1-
    steerAbs*
    speedRatio*
    .23;

  const forward=
    boat.speedCommand*
    turnLoss;

  const hx=
    Math.cos(
      boat.angle
    );

  const hy=
    Math.sin(
      boat.angle
    );

  const targetVX=
    hx*
    forward;

  const targetVY=
    hy*
    forward;

  const slip=
    steerAbs*
    speedRatio;

  const grip=
    3.7-
    2.35*
    slip;

  boat.vx+=
    (targetVX-boat.vx)*
    Math.min(
      1,
      grip*dt
    );

  boat.vy+=
    (targetVY-boat.vy)*
    Math.min(
      1,
      grip*dt
    );

  const drag=
    Math.max(
      0,
      1-(.035+.10*slip)*dt
    );

  boat.vx*=drag;
  boat.vy*=drag;

  boat.x+=
    boat.vx*
    dt;

  boat.y+=
    boat.vy*
    dt;

  const margin=5;

  if(boat.x<margin){
    boat.x=margin;
    boat.vx=0;
  }

  if(boat.x>WORLD.w-margin){
    boat.x=WORLD.w-margin;
    boat.vx=0;
  }

  if(boat.y<margin){
    boat.y=margin;
    boat.vy=0;
  }

  if(boat.y>WORLD.h-margin){
    boat.y=WORLD.h-margin;
    boat.vy=0;
  }

  marks.forEach(
    collideMark
  );

  const kmh=
    Math.hypot(
      boat.vx,
      boat.vy
    )*
    3.6;

  $("speed").innerHTML=
    kmh.toFixed(1)+
    '<small>km/h</small>';
}

function updateCamera(dt){
  const speed=
    Math.hypot(
      boat.vx,
      boat.vy
    );

  const sr=
    clamp(
      speed/22.22,
      0,
      1
    );

  const back=1.15;

  const tx=
    boat.x-
    Math.cos(
      boat.angle
    )*
    back;

  const ty=
    boat.y-
    Math.sin(
      boat.angle
    )*
    back;

  camera.x=
    lerp(
      camera.x,
      tx,
      damp(
        10.5,
        dt
      )
    );

  camera.y=
    lerp(
      camera.y,
      ty,
      damp(
        10.5,
        dt
      )
    );

  camera.angle=
    lerpAngle(
      camera.angle,
      boat.angle,
      damp(
        7.5,
        dt
      )
    );

  const targetRoll=
    clamp(
      -boat.yaw*
      (.10+.25*sr),
      -.10,
      .10
    );

  camera.roll=
    lerp(
      camera.roll,
      targetRoll,
      damp(
        5.0,
        dt
      )
    );

  const bobTarget=
    Math.sin(
      clock*7.3
    )*
    (.15+.32*sr)
    +
    Math.sin(
      clock*12.8
    )*
    (.08+.16*sr);

  camera.bob=
    lerp(
      camera.bob,
      bobTarget,
      damp(
        8,
        dt
      )
    );

  const shake=
    sr*
    sr*
    .55;

  camera.shakeX=
    Math.sin(
      clock*22
    )*
    shake;

  camera.shakeY=
    Math.cos(
      clock*18.5
    )*
    shake*
    .6;
}

function cameraSpace(x,y){
  const dx=
    x-camera.x;

  const dy=
    y-camera.y;

  const ca=
    Math.cos(
      camera.angle
    );

  const sa=
    Math.sin(
      camera.angle
    );

  return{
    forward:
      dx*ca+
      dy*sa,

    right:
      -dx*sa+
      dy*ca
  };
}

function projectWorld(
  x,
  y,
  height=0
){
  const p=
    cameraSpace(
      x,
      y
    );

  if(p.forward<-2){
    return null;
  }

  const horizon=
    H*.315+
    camera.bob+
    camera.shakeY;

  const cameraHeight=
    1.35;

  const focal=
    Math.max(
      510,
      W*.76
    );

  const z=
    Math.max(
      2.8,
      p.forward+3.6
    );

  const sc=
    focal/z;

  let sx=
    W*.5+
    p.right*
    sc+
    camera.shakeX;

  let sy=
    horizon+
    (cameraHeight-height)*
    sc;

  const dx=
    sx-W*.5;

  const dy=
    sy-horizon;

  const cr=
    Math.cos(
      camera.roll
    );

  const sr=
    Math.sin(
      camera.roll
    );

  sx=
    W*.5+
    dx*cr-
    dy*sr;

  sy=
    horizon+
    dx*sr+
    dy*cr;

  return{
    x:sx,
    y:sy,
    scale:sc,
    forward:p.forward,
    horizon
  };
}

function drawSky(){
  const h=
    H*.315+
    camera.bob+
    camera.shakeY;

  const g=
    ctx.createLinearGradient(
      0,
      0,
      0,
      h
    );

  g.addColorStop(
    0,
    "#58bfe8"
  );

  g.addColorStop(
    .56,
    "#93dcf4"
  );

  g.addColorStop(
    1,
    "#e7faff"
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    0,
    0,
    W,
    h+2
  );

  ctx.save();

  ctx.globalAlpha=
    .5;

  ctx.fillStyle=
    "#fff";

  const drift=
    (clock*3.5)%W;

  for(
    let i=-1;
    i<5;
    i++
  ){
    const px=
      i*260+
      110-
      drift*.12;

    const py=
      55+
      (i%2)*26;

    ctx.beginPath();

    ctx.ellipse(
      px,
      py,
      72,
      18,
      0,
      0,
      Math.PI*2
    );

    ctx.ellipse(
      px+45,
      py-7,
      42,
      19,
      0,
      0,
      Math.PI*2
    );

    ctx.ellipse(
      px-42,
      py+2,
      38,
      15,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.restore();
}

function drawStadium(){
  const h=
    H*.315+
    camera.bob+
    camera.shakeY;

  ctx.fillStyle=
    "#3b6271";

  ctx.fillRect(
    0,
    h-3,
    W,
    13
  );

  ctx.fillStyle=
    "#526f79";

  ctx.beginPath();

  ctx.moveTo(
    0,
    h-25
  );

  ctx.lineTo(
    W*.12,
    h-36
  );

  ctx.lineTo(
    W*.28,
    h-31
  );

  ctx.lineTo(
    W*.39,
    h-55
  );

  ctx.lineTo(
    W*.67,
    h-47
  );

  ctx.lineTo(
    W*.79,
    h-32
  );

  ctx.lineTo(
    W,
    h-41
  );

  ctx.lineTo(
    W,
    h
  );

  ctx.lineTo(
    0,
    h
  );

  ctx.closePath();

  ctx.fill();

  ctx.fillStyle=
    "rgba(241,248,250,.80)";

  for(
    let i=0;
    i<6;
    i++
  ){
    const bw=
      W*.105;

    const bx=
      (
        (
          i*W*.21+
          40+
          Math.sin(
            camera.angle
          )*
          25
        )%
        (W+180)
      )-
      90;

    const bh=
      15+
      (i%3)*11;

    ctx.fillRect(
      bx,
      h-5-bh,
      bw,
      bh
    );
  }

  ctx.fillStyle=
    "rgba(20,71,94,.65)";

  ctx.fillRect(
    0,
    h+2,
    W,
    5
  );
}

function drawWater(){
  const h=
    H*.315+
    camera.bob+
    camera.shakeY;

  const g=
    ctx.createLinearGradient(
      0,
      h,
      0,
      H
    );

  g.addColorStop(
    0,
    "#58c5e6"
  );

  g.addColorStop(
    .32,
    "#159ec8"
  );

  g.addColorStop(
    1,
    "#067292"
  );

  ctx.fillStyle=g;

  ctx.fillRect(
    0,
    h,
    W,
    H-h
  );

  const sr=
    clamp(
      Math.hypot(
        boat.vx,
        boat.vy
      )/
      22.22,
      0,
      1
    );

  for(
    let i=0;
    i<24;
    i++
  ){
    const q=
      i/23;

    const yy=
      h+
      (H-h)*
      Math.pow(
        q,
        1.75
      );

    const amp=
      .5+
      q*4.3;

    ctx.strokeStyle=
      `rgba(255,255,255,${.05+q*.13})`;

    ctx.lineWidth=1;

    ctx.beginPath();

    for(
      let px=-20;
      px<=W+20;
      px+=30
    ){
      const wave=
        Math.sin(
          px*.027+
          i*.87+
          clock*
          (1.5+sr*2.5)
        )*
        amp;

      if(px===-20){
        ctx.moveTo(
          px,
          yy+wave
        );
      }else{
        ctx.lineTo(
          px,
          yy+wave
        );
      }
    }

    ctx.stroke();
  }

  if(sr>.06){
    ctx.save();

    ctx.globalAlpha=
      .06+
      sr*.16;

    ctx.strokeStyle=
      "#e6fcff";

    for(
      let i=0;
      i<17;
      i++
    ){
      const px=
        (
          i*83.7+
          clock*85*
          (.5+sr)
        )%
        W;

      const sy=
        h+
        20+
        (
          (i*47)%
          Math.max(
            70,
            H-h-80
          )
        );

      const len=
        13+
        sr*58;

      ctx.beginPath();

      ctx.moveTo(
        px,
        sy
      );

      ctx.lineTo(
        px+
        (px-W*.5)*
        .028,
        sy+len
      );

      ctx.stroke();
    }

    ctx.restore();
  }
}

function coursePoints(){
  const p=[];

  for(
    let i=0;
    i<=70;
    i++
  ){
    const q=
      i/70;

    p.push({
      x:
        lerp(
          COURSE.leftX,
          COURSE.rightX,
          q
        ),
      y:
        COURSE.bottomY
    });
  }

  for(
    let i=1;
    i<=80;
    i++
  ){
    const q=
      i/80;

    const a=
      Math.PI/2-
      Math.PI*q;

    p.push({
      x:
        COURSE.rightX+
        COURSE.turnRadius*
        Math.cos(a),

      y:
        COURSE.centerY+
        COURSE.turnRadius*
        Math.sin(a)
    });
  }

  for(
    let i=1;
    i<=70;
    i++
  ){
    const q=
      i/70;

    p.push({
      x:
        lerp(
          COURSE.rightX,
          COURSE.leftX,
          q
        ),
      y:
        COURSE.topY
    });
  }

  for(
    let i=1;
    i<=80;
    i++
  ){
    const q=
      i/80;

    const a=
      -Math.PI/2-
      Math.PI*q;

    p.push({
      x:
        COURSE.leftX+
        COURSE.turnRadius*
        Math.cos(a),

      y:
        COURSE.centerY+
        COURSE.turnRadius*
        Math.sin(a)
    });
  }

  return p;
}

function drawCourse(){
  ctx.save();

  ctx.strokeStyle=
    "rgba(235,252,255,.18)";

  ctx.lineWidth=
    2;

  ctx.setLineDash(
    [7,13]
  );

  let active=
    false;

  ctx.beginPath();

  for(
    const p
    of coursePoints()
  ){
    const s=
      projectWorld(
        p.x,
        p.y,
        0
      );

    if(
      !s||
      s.forward<1.5
    ){
      active=false;
      continue;
    }

    if(
      s.x<-W*.7||
      s.x>W*1.7||
      s.y<-H*.4||
      s.y>H*1.5
    ){
      active=false;
      continue;
    }

    if(!active){
      ctx.moveTo(
        s.x,
        s.y
      );

      active=true;
    }else{
      ctx.lineTo(
        s.x,
        s.y
      );
    }
  }

  ctx.stroke();

  ctx.restore();

  marks.forEach(
    drawTurnMark
  );
}

function drawTurnMark(m){
  const base=
    projectWorld(
      m.x,
      m.y,
      0
    );

  const top=
    projectWorld(
      m.x,
      m.y,
      .95
    );

  if(
    !base||
    !top||
    base.forward<1.2
  ){
    return;
  }

  if(
    base.x<-140||
    base.x>W+140||
    base.y<-80||
    top.y>H+100
  ){
    return;
  }

  const physicalWidth=
    1.10;

  const halfPx=
    clamp(
      physicalWidth*
      .5*
      base.scale,
      3.5,
      65
    );

  const heightPx=
    clamp(
      base.y-top.y,
      5,
      100
    );

  const bx=
    base.x;

  const by=
    base.y;

  const ty=
    by-heightPx;

  ctx.save();

  ctx.globalAlpha=
    .22;

  ctx.fillStyle=
    "#08384b";

  ctx.beginPath();

  ctx.ellipse(
    bx+
    halfPx*.12,
    by+2,
    halfPx*1.18,
    Math.max(
      2,
      halfPx*.20
    ),
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

  const widths=[
    halfPx*.92,
    halfPx*.72,
    halfPx*.48,
    halfPx*.12
  ];

  const ys=[
    by,
    by-heightPx*.34,
    by-heightPx*.67,
    ty
  ];

  const colors=[
    "#ffffff",
    "#e32636",
    "#ffffff"
  ];

  for(
    let i=0;
    i<3;
    i++
  ){
    const y0=
      ys[i];

    const y1=
      ys[i+1];

    const w0=
      widths[i];

    const w1=
      widths[i+1];

    const grd=
      ctx.createLinearGradient(
        bx-w0,
        y1,
        bx+w0,
        y0
      );

    if(
      colors[i]==="#ffffff"
    ){
      grd.addColorStop(
        0,
        "#ffffff"
      );

      grd.addColorStop(
        .55,
        "#e9eef1"
      );

      grd.addColorStop(
        1,
        "#b6c1c7"
      );
    }else{
      grd.addColorStop(
        0,
        "#ff5260"
      );

      grd.addColorStop(
        .5,
        "#e32636"
      );

      grd.addColorStop(
        1,
        "#a91522"
      );
    }

    ctx.fillStyle=
      grd;

    ctx.beginPath();

    ctx.moveTo(
      bx-w0,
      y0
    );

    ctx.lineTo(
      bx-w1,
      y1
    );

    ctx.lineTo(
      bx+w1,
      y1
    );

    ctx.lineTo(
      bx+w0,
      y0
    );

    ctx.closePath();

    ctx.fill();

    ctx.strokeStyle=
      "rgba(80,80,80,.48)";

    ctx.lineWidth=
      Math.max(
        1,
        halfPx*.025
      );

    ctx.stroke();
  }

  ctx.fillStyle=
    "#e32636";

  ctx.beginPath();

  ctx.ellipse(
    bx,
    ty,
    Math.max(
      1.5,
      halfPx*.12
    ),
    Math.max(
      1,
      halfPx*.05
    ),
    0,
    0,
    Math.PI*2
  );

  ctx.fill();
}

function drawSpray(){
  const sr=
    clamp(
      Math.hypot(
        boat.vx,
        boat.vy
      )/
      22.22,
      0,
      1
    );

  if(sr<.08){
    return;
  }

  const cx=
    W*.5;

  const by=
    H*.91;

  ctx.save();

  ctx.globalCompositeOperation=
    "screen";

  for(
    const side
    of[-1,1]
  ){
    ctx.beginPath();

    ctx.moveTo(
      cx+
      side*
      (40+sr*14),
      by
    );

    ctx.quadraticCurveTo(
      cx+
      side*
      (82+sr*40),
      H*.865,
      cx+
      side*
      (135+sr*115),
      H*.995
    );

    ctx.strokeStyle=
      `rgba(230,252,255,${.10+sr*.34})`;

    ctx.lineWidth=
      4+
      sr*8;

    ctx.stroke();
  }

  ctx.fillStyle=
    `rgba(245,254,255,${.10+sr*.28})`;

  for(
    let i=0;
    i<26;
    i++
  ){
    const side=
      i%2
      ?-1
      :1;

    const phase=
      (
        clock*
        (1.7+sr*2.8)
        +
        i*.43
      )%
      1;

    const px=
      cx+
      side*
      (
        50+
        phase*
        (80+sr*135)
      );

    const py=
      H*.92-
      phase*
      (12+sr*35)
      +
      Math.sin(
        i*2.3+
        clock*8
      )*
      3;

    const r=
      1+
      (i%3)*.6;

    ctx.beginPath();

    ctx.arc(
      px,
      py,
      r,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.restore();
}

function drawBoatCockpit(){
  const sr=
    clamp(
      Math.hypot(
        boat.vx,
        boat.vy
      )/
      22.22,
      0,
      1
    );

  const relative=
    Math.atan2(
      Math.sin(
        boat.angle-
        camera.angle
      ),
      Math.cos(
        boat.angle-
        camera.angle
      )
    );

  const steerLean=
    clamp(
      relative*.48,
      -.11,
      .11
    );

  ctx.save();

  ctx.translate(
    W*.5+
    camera.shakeX*.30,
    H*.935+
    camera.bob*.18
  );

  ctx.rotate(
    camera.roll*.45+
    steerLean
  );

  const S=
    clamp(
      Math.min(
        W/1100,
        H/500
      ),
      .68,
      1.18
    );

  ctx.scale(
    S,
    S
  );

  ctx.fillStyle=
    "#151e23";

  ctx.beginPath();

  ctx.moveTo(
    0,
    -184
  );

  ctx.lineTo(
    -112,
    -18
  );

  ctx.lineTo(
    -245,
    88
  );

  ctx.lineTo(
    245,
    88
  );

  ctx.lineTo(
    112,
    -18
  );

  ctx.closePath();

  ctx.fill();

  const hull=
    ctx.createLinearGradient(
      -210,
      -180,
      180,
      95
    );

  hull.addColorStop(
    0,
    "#ffffff"
  );

  hull.addColorStop(
    .5,
    "#edf2f4"
  );

  hull.addColorStop(
    1,
    "#aeb9be"
  );

  ctx.fillStyle=
    hull;

  ctx.beginPath();

  ctx.moveTo(
    0,
    -205
  );

  ctx.bezierCurveTo(
    -35,
    -166,
    -68,
    -102,
    -88,
    -44
  );

  ctx.lineTo(
    -205,
    60
  );

  ctx.lineTo(
    -225,
    88
  );

  ctx.lineTo(
    225,
    88
  );

  ctx.lineTo(
    205,
    60
  );

  ctx.lineTo(
    88,
    -44
  );

  ctx.bezierCurveTo(
    68,
    -102,
    35,
    -166,
    0,
    -205
  );

  ctx.closePath();

  ctx.fill();

  ctx.fillStyle=
    "#d9233e";

  ctx.beginPath();

  ctx.moveTo(
    -9,
    -197
  );

  ctx.lineTo(
    -43,
    -78
  );

  ctx.lineTo(
    -150,
    45
  );

  ctx.lineTo(
    -94,
    45
  );

  ctx.lineTo(
    0,
    -116
  );

  ctx.closePath();

  ctx.fill();

  ctx.beginPath();

  ctx.moveTo(
    9,
    -197
  );

  ctx.lineTo(
    43,
    -78
  );

  ctx.lineTo(
    150,
    45
  );

  ctx.lineTo(
    94,
    45
  );

  ctx.lineTo(
    0,
    -116
  );

  ctx.closePath();

  ctx.fill();

  const cockpit=
    ctx.createLinearGradient(
      0,
      -60,
      0,
      70
    );

  cockpit.addColorStop(
    0,
    "#172228"
  );

  cockpit.addColorStop(
    1,
    "#2c393f"
  );

  ctx.fillStyle=
    cockpit;

  ctx.beginPath();

  ctx.moveTo(
    -42,
    58
  );

  ctx.lineTo(
    -24,
    -57
  );

  ctx.quadraticCurveTo(
    0,
    -77,
    24,
    -57
  );

  ctx.lineTo(
    42,
    58
  );

  ctx.closePath();

  ctx.fill();

  ctx.strokeStyle=
    "#11181d";

  ctx.lineWidth=
    7;

  ctx.beginPath();

  ctx.arc(
    0,
    16,
    37,
    0,
    Math.PI*2
  );

  ctx.stroke();

  ctx.lineWidth=
    4;

  for(
    let a=0;
    a<Math.PI*2;
    a+=Math.PI/3
  ){
    ctx.beginPath();

    ctx.moveTo(
      0,
      16
    );

    ctx.lineTo(
      Math.cos(a)*31,
      16+
      Math.sin(a)*31
    );

    ctx.stroke();
  }

  const motor=
    ctx.createLinearGradient(
      85,
      -35,
      155,
      65
    );

  motor.addColorStop(
    0,
    "#475158"
  );

  motor.addColorStop(
    .55,
    "#242d32"
  );

  motor.addColorStop(
    1,
    "#11181c"
  );

  ctx.fillStyle=
    motor;

  ctx.beginPath();

  ctx.roundRect(
    86,
    -27,
    76,
    94,
    20
  );

  ctx.fill();

  ctx.fillStyle=
    "rgba(255,255,255,.12)";

  ctx.beginPath();

  ctx.roundRect(
    96,
    -18,
    21,
    73,
    10
  );

  ctx.fill();

  ctx.strokeStyle=
    "rgba(54,70,78,.34)";

  ctx.lineWidth=
    2;

  ctx.beginPath();

  ctx.moveTo(
    -85,
    6
  );

  ctx.lineTo(
    -193,
    67
  );

  ctx.moveTo(
    85,
    6
  );

  ctx.lineTo(
    193,
    67
  );

  ctx.stroke();

  ctx.restore();

  if(sr>.10){
    ctx.save();

    ctx.globalAlpha=
      .08+
      sr*.24;

    ctx.fillStyle=
      "#fff";

    for(
      let i=0;
      i<23;
      i++
    ){
      const px=
        W*.5+
        Math.sin(
          i*17.3
        )*
        W*.31;

      const py=
        H*.94+
        (
          (i*29)%
          Math.max(
            12,
            H*.06
          )
        );

      const r=
        1.1+
        (i%4)*.7;

      ctx.beginPath();

      ctx.arc(
        px,
        py,
        r,
        0,
        Math.PI*2
      );

      ctx.fill();
    }

    ctx.restore();
  }
}

function drawDistancePosts(){
  const posts=[
    {
      x:COURSE.leftX+100,
      y:COURSE.bottomY-22,
      label:"200"
    },
    {
      x:COURSE.leftX+200,
      y:COURSE.bottomY-22,
      label:"100"
    }
  ];

  for(
    const p
    of posts
  ){
    const btm=
      projectWorld(
        p.x,
        p.y,
        0
      );

    const top=
      projectWorld(
        p.x,
        p.y,
        5.5
      );

    if(
      !btm||
      !top||
      btm.forward<5
    ){
      return;
    }

    if(
      btm.x<-30||
      btm.x>W+30
    ){
      continue;
    }

    ctx.strokeStyle=
      "rgba(35,47,52,.75)";

    ctx.lineWidth=
      Math.max(
        1,
        btm.scale*.035
      );

    ctx.beginPath();

    ctx.moveTo(
      btm.x,
      btm.y
    );

    ctx.lineTo(
      top.x,
      top.y
    );

    ctx.stroke();

    ctx.fillStyle=
      "rgba(255,255,255,.75)";

    ctx.font=
      `700 ${clamp(11+btm.scale*.06,10,18)}px sans-serif`;

    ctx.textAlign=
      "center";

    ctx.fillText(
      p.label+"m",
      top.x,
      top.y-4
    );
  }
}

function render(){
  drawSky();
  drawStadium();
  drawWater();
  drawDistancePosts();
  drawCourse();
  drawSpray();
  drawBoatCockpit();

  const vignette=
    ctx.createRadialGradient(
      W*.5,
      H*.48,
      Math.min(W,H)*.18,
      W*.5,
      H*.48,
      Math.max(W,H)*.70
    );

  vignette.addColorStop(
    .55,
    "rgba(0,0,0,0)"
  );

  vignette.addColorStop(
    1,
    "rgba(0,18,30,.17)"
  );

  ctx.fillStyle=
    vignette;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );
}

function loop(now){
  const dt=
    Math.min(
      .035,
      (now-last)/1000
    );

  last=
    now;

  clock+=
    dt;

  physics(
    dt
  );

  updateCamera(
    dt
  );

  render();

  requestAnimationFrame(
    loop
  );
}

requestAnimationFrame(
  loop
);
</script>
