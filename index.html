const lerp=(a,b,t)=>a+(b-a)*t;
const damp=(k,dt)=>1-Math.exp(-k*dt);

function lerpAngle(a,b,t){
  return a+Math.atan2(Math.sin(b-a),Math.cos(b-a))*t
}

let W=innerWidth,H=innerHeight,DPR=1,last=performance.now(),clock=0;

const COURSE={

const marks=[

const boat={

  roll:0,
  bob:0,
  shakeX:0,
  shakeY:0,
  lookAssist:0
};

const RACE={
  totalLaps:3,
  startX:165,
  startHalfWidth:16,

  rightGate:{
    x:COURSE.rightX+COURSE.rightRadius,
    y:COURSE.rightY,
    r:22
  },

  leftGate:{
    x:COURSE.leftX-COURSE.leftRadius,
    y:COURSE.leftY,
    r:22
  }
};

let raceStarted=false;
let currentLap=0;
let racePhase=0;
let raceFinished=false;

function updateLapHUD(){
  const el=$("lapbox");
  if(!el)return;

  if(raceFinished){
    el.textContent="GOAL";
  }else if(!raceStarted){
    el.textContent=`LAP --/${RACE.totalLaps}`;
  }else{
    el.textContent=`LAP ${currentLap}/${RACE.totalLaps}`;
  }
}

function crossedStartLine(oldX,oldY){

  const nearNow=
    Math.abs(boat.y-COURSE.bottomY)<
    RACE.startHalfWidth;

  const nearOld=
    Math.abs(oldY-COURSE.bottomY)<
    RACE.startHalfWidth;

  return(
    oldX<RACE.startX &&
    boat.x>=RACE.startX &&
    nearNow &&
    nearOld
  );
}

function insideGate(g){
  return Math.hypot(
    boat.x-g.x,
    boat.y-g.y
  ) < g.r;
}

function updateRaceProgress(oldX,oldY){

  if(raceFinished)return;

  if(!raceStarted){

    if(crossedStartLine(oldX,oldY)){
      raceStarted=true;
      currentLap=1;
      racePhase=1;
      updateLapHUD();
    }

    return;
  }

  if(racePhase===1){

    if(insideGate(RACE.rightGate)){
      racePhase=2;
    }

    return;
  }

  if(racePhase===2){

    if(insideGate(RACE.leftGate)){
      racePhase=3;
    }

    return;
  }

  if(racePhase===3 && crossedStartLine(oldX,oldY)){

    if(currentLap>=RACE.totalLaps){
      raceFinished=true;
      updateLapHUD();
    }else{
      currentLap++;
      racePhase=1;
      updateLapHUD();
    }
  }
}

const ta=$("throttle");
const sa=$("steer");

function setThrottle(y){

  const r=ta.getBoundingClientRect();

  throttle=clamp(
    1-(y-r.top)/r.height,
    0,
    1
  );

  $("tknob").style.bottom=(throttle*100)+"%";
  $("tfill").style.height=(throttle*100)+"%";
}

function setSteering(px){

  const r=sa.getBoundingClientRect();

  steering=clamp(
    (((px-r.left)/r.width)-.5)*2,
    -1,
    1
  );

  $("sknob").style.left=(50+steering*45)+"%";

  $("state").textContent=
    steering<-.08 ? "舵：左 ←" :
    steering>.08 ? "舵：右 →" :
    "舵：中央";
}

function centerSteering(){

  steering=0;

  $("sknob").style.left="50%";
  $("state").textContent="舵：中央";
}

ta.onpointerdown=e=>{
  ta.setPointerCapture(e.pointerId);
  setThrottle(e.clientY);
};

ta.onpointermove=e=>{

    setThrottle(e.clientY);
  }
};

sa.onpointerdown=e=>{

};

  }
};

sa.onpointerup=centerSteering;
sa.onpointercancel=centerSteering;

function collideMark(m){

  const dx=boat.x-m.x;
  const dy=boat.y-m.y;

  const d=Math.hypot(dx,dy);
  const min=boat.r+m.r;

  if(d>=min)return;

  const nx=d>.0001 ? dx/d : -Math.cos(boat.angle);
  const ny=d>.0001 ? dy/d : -Math.sin(boat.angle);

  boat.x=m.x+nx*min;
  boat.y=m.y+ny*min;

  const vn=boat.vx*nx+boat.vy*ny;

  if(vn<0){
    boat.vx-=vn*nx;
    boat.vy-=vn*ny;
  }

  boat.vx*=.34;
  boat.vy*=.34;

  boat.speedCommand*=.45;
  boat.yaw*=.45;
}

function physics(dt){

  if(!running)return;

  const oldX=boat.x;
  const oldY=boat.y;

  const MAX=22.22;
  const targetSpeed=throttle*MAX;

  const response=
    targetSpeed>boat.speedCommand
    ? .62
    : 1.65;

  boat.speedCommand+=
    (targetSpeed-boat.speedCommand)*
    Math.min(1,response*dt);

  const speedRatio=
    clamp(boat.speedCommand/MAX,0,1);

  const steerAbs=Math.abs(steering);

  const targetYaw=
    steering*(.13+.42*speedRatio);

  const yawResponse=
    steerAbs<.02 ? 3.6 : 2.35;

  boat.yaw+=
    (targetYaw-boat.yaw)*
    Math.min(1,yawResponse*dt);

  if(steerAbs<.02){
    boat.yaw*=Math.pow(.28,dt);
  }

  boat.angle+=boat.yaw*dt;

  const turnLoss=
    1-steerAbs*speedRatio*.23;

  const forward=
    boat.speedCommand*turnLoss;

  const hx=Math.cos(boat.angle);
  const hy=Math.sin(boat.angle);

  const targetVX=hx*forward;
  const targetVY=hy*forward;

  const slip=
    steerAbs*speedRatio;

  const grip=
    3.7-2.35*slip;

  boat.vx+=
    (targetVX-boat.vx)*
    Math.min(1,grip*dt);

  boat.vy+=
    (targetVY-boat.vy)*
    Math.min(1,grip*dt);

  const drag=
    Math.max(
      0,
      1-(.035+.10*slip)*dt
    );

  boat.vx*=drag;
  boat.vy*=drag;

  boat.x+=boat.vx*dt;
  boat.y+=boat.vy*dt;

  const margin=5;

  if(boat.x<margin){
    boat.x=margin;
    boat.vx=0;
  }

  if(boat.x>WORLD.w-margin){
    boat.x=WORLD.w-margin;
    boat.vx=0;
  }

  if(boat.y<margin){
    boat.y=margin;
    boat.vy=0;
  }

  if(boat.y>WORLD.h-margin){
    boat.y=WORLD.h-margin;
    boat.vy=0;
  }

  marks.forEach(collideMark);

  updateVisualTarget();
  updateRaceProgress(oldX,oldY);

  const kmh=
    Math.hypot(boat.vx,boat.vy)*3.6;

  $("speed").innerHTML=
    kmh.toFixed(1)+
    '<small>km/h</small>';
}

function angleDiff(a,b){

  return Math.atan2(
    Math.sin(b-a),
    Math.cos(b-a)

}

}

function drawWater(){
const sr=clamp(Math.hypot(boat.vx,boat.vy)/22.22,0,1);
const h=beginHorizonRoll();

// Fresnel-like gradient: pale reflective distance -> deep teal foreground
const base=ctx.createLinearGradient(0,h,0,H+H*.30);
base.addColorStop(0,"#7fc2ca");
base.addColorStop(.08,"#59abb7");
base.addColorStop(.25,"#2a8b9a");
base.addColorStop(.48,"#177487");
base.addColorStop(.73,"#0d6073");
base.addColorStop(1,"#084b5b");
ctx.fillStyle=base;
ctx.fillRect(-W*.20,h-3,W*1.40,H-h+H*.35);

// muted sky reflection
const refl=ctx.createLinearGradient(0,h,0,h+(H-h)*.28);
refl.addColorStop(0,"rgba(238,246,244,.28)");
refl.addColorStop(.50,"rgba(205,235,238,.08)");
refl.addColorStop(1,"rgba(205,235,238,0)");
ctx.fillStyle=refl;
ctx.fillRect(-W*.15,h-1,W*1.30,(H-h)*.34);

// fine distant ripples and larger foreground chop
for(let i=0;i<46;i++){
const q=(i+1)/46;
const yy=h+Math.pow(q,1.76)*(H-h+34);
const amp=.22+q*3.8;
const phase=clock*(.48+sr*1.75)+i*.61+camera.angle*.25;

ctx.strokeStyle=`rgba(224,244,246,${.018+q*.058})`;
ctx.lineWidth=.55+q*.50;
ctx.beginPath();

for(let x=-60;x<=W+60;x+=15){
const y=
yy+
Math.sin(x*.035+phase)*amp+
Math.sin(x*.013-phase*.58)*amp*.52;

if(x===-60)ctx.moveTo(x,y);
else ctx.lineTo(x,y);
}
ctx.stroke();
}

// dark troughs prevent the water from looking like horizontal stripes
for(let i=0;i<28;i++){
const q=(i+1)/28;
const yy=h+Math.pow(q,1.60)*(H-h+28);
const amp=.28+q*3.1;
const phase=clock*(.35+sr*.85)+i*.77;

ctx.strokeStyle=`rgba(3,57,67,${.012+q*.042})`;
ctx.lineWidth=.65+q*.60;
ctx.beginPath();

for(let x=-60;x<=W+60;x+=20){
const y=
yy+
Math.sin(x*.029+phase)*amp+
Math.sin(x*.009+phase*.31)*amp*.35;

if(x===-60)ctx.moveTo(x,y);
else ctx.lineTo(x,y);
}
ctx.stroke();
}

// short broken highlights moving with the boat
ctx.save();
ctx.globalCompositeOperation="screen";

for(let i=0;i<42;i++){
const q=((i*37)%101)/101;
const y=h+(H-h)*(.10+.85*q*q);
const x=(i*83.1+clock*(18+sr*54))%(W+100)-50;
const len=3+q*19+sr*q*12;
const alpha=.018+q*.065+sr*q*.025;

ctx.strokeStyle=`rgba(236,252,252,${alpha})`;
ctx.lineWidth=.55+q*.60;
ctx.beginPath();
ctx.moveTo(x,y);
ctx.lineTo(x+len,y+Math.sin(i+clock)*.8);
ctx.stroke();
}

ctx.restore();
endHorizonRoll();

// reflections/glints are screen-space so they stay subtle and broken
drawShoreReflections();
drawSunGlints();
}

function coursePoints(){
const p=[];

const bottomStart={x:COURSE.leftX-36,y:COURSE.bottomY};
const bottomEnd={x:COURSE.rightX-8,y:COURSE.bottomY-2};

for(let i=0;i<=72;i++){
const q=i/72;
p.push({
x:lerp(bottomStart.x,bottomEnd.x,q),
y:lerp(bottomStart.y,bottomEnd.y,q)
});
}

for(let i=1;i<=90;i++){
const q=i/90;
const a=Math.PI/2-Math.PI*q;
p.push({
x:COURSE.rightX+COURSE.rightRadius*Math.cos(a),
y:COURSE.rightY+COURSE.rightRadius*Math.sin(a)
});
}

const upperStart={x:COURSE.rightX-3,y:COURSE.topY};
const upperEnd={x:COURSE.leftX+5,y:COURSE.topY+7};

for(let i=1;i<=72;i++){
const q=i/72;
p.push({
x:lerp(upperStart.x,upperEnd.x,q),
y:lerp(upperStart.y,upperEnd.y,q)
});
}

for(let i=1;i<=90;i++){
const q=i/90;
const a=-Math.PI/2-Math.PI*q;
p.push({
x:COURSE.leftX+COURSE.leftRadius*Math.cos(a),
y:COURSE.leftY+COURSE.leftRadius*Math.sin(a)
});
}

return p;
}

function drawLightTower(p){
const btm=projectWorld(p.x,p.y,0);
const top=projectWorld(p.x,p.y,p.h);

if(!btm||!top||btm.forward<3)return;
if(btm.x<-80||btm.x>W+80)return;

const lw=clamp(btm.scale*.023,1,3);

ctx.strokeStyle="rgba(34,48,54,.90)";
ctx.lineWidth=lw;

const spread=clamp(btm.scale*.09,1.5,7);

ctx.beginPath();
ctx.moveTo(btm.x-spread,btm.y);
ctx.lineTo(top.x-spread*.35,top.y);
ctx.moveTo(btm.x+spread,btm.y);
ctx.lineTo(top.x+spread*.35,top.y);
ctx.stroke();

for(let i=1;i<=4;i++){
const q=i/5;
const yy=lerp(btm.y,top.y,q);
const xx=lerp(btm.x,top.x,q);
const sw=spread*(1-q*.55);
ctx.beginPath();
ctx.moveTo(xx-sw,yy);
ctx.lineTo(xx+sw,yy-3);
ctx.stroke();
}

const headW=clamp(btm.scale*.24,4,18);
ctx.strokeStyle="rgba(47,57,62,.95)";
ctx.lineWidth=Math.max(1,lw*1.5);
ctx.beginPath();
ctx.moveTo(top.x-headW*.5,top.y);
ctx.lineTo(top.x+headW*.5,top.y);
ctx.stroke();

ctx.fillStyle="rgba(242,249,250,.9)";
for(let k=-2;k<=2;k++){
ctx.fillRect(
top.x+k*(headW/5)-1,
top.y-2,
2,
2
);
}
}

function drawGrandstand(g){
const leftBase=projectWorld(g.x-g.w*.5,g.y,0);
const rightBase=projectWorld(g.x+g.w*.5,g.y,0);
const rightTop=projectWorld(g.x+g.w*.5,g.y,g.h);
const leftTop=projectWorld(g.x-g.w*.5,g.y,g.h);
    if(!leftBase||!rightBase||!rightTop||!leftTop)return;
  if(Math.max(leftBase.forward,rightBase.forward)<4)return;

  const body=ctx.createLinearGradient(
    leftTop.x,leftTop.y,
    rightBase.x,rightBase.y
  );
  body.addColorStop(0,"rgba(242,244,242,.98)");
  body.addColorStop(.65,"rgba(203,211,211,.98)");
  body.addColorStop(1,"rgba(162,177,181,.96)");

  ctx.fillStyle=body;
  ctx.beginPath();
  ctx.moveTo(leftBase.x,leftBase.y);
  ctx.lineTo(rightBase.x,rightBase.y);
  ctx.lineTo(rightTop.x,rightTop.y);
  ctx.lineTo(leftTop.x,leftTop.y);
  ctx.closePath();
  ctx.fill();

  // shaded underside / tier depth
  const lowL=projectWorld(g.x-g.w*.48,g.y,g.h*.10);
  const lowR=projectWorld(g.x+g.w*.48,g.y,g.h*.10);
  const midR=projectWorld(g.x+g.w*.48,g.y,g.h*.40);
  const midL=projectWorld(g.x-g.w*.48,g.y,g.h*.40);

  if(lowL&&lowR&&midR&&midL){
    ctx.fillStyle="rgba(91,105,108,.55)";
    ctx.beginPath();
    ctx.moveTo(lowL.x,lowL.y);
    ctx.lineTo(lowR.x,lowR.y);
    ctx.lineTo(midR.x,midR.y);
    ctx.lineTo(midL.x,midL.y);
    ctx.closePath();
    ctx.fill();
  }

  // upper glass band
  const lb=projectWorld(g.x-g.w*.47,g.y,g.h*.55);
  const rb=projectWorld(g.x+g.w*.47,g.y,g.h*.55);
  const rt=projectWorld(g.x+g.w*.47,g.y,g.h*.77);
  const lt=projectWorld(g.x-g.w*.47,g.y,g.h*.77);

  if(lb&&rb&&rt&&lt){
    const glass=ctx.createLinearGradient(lb.x,lb.y,rt.x,rt.y);
    glass.addColorStop(0,"rgba(26,54,65,.94)");
    glass.addColorStop(.5,"rgba(50,83,94,.90)");
    glass.addColorStop(1,"rgba(26,50,61,.94)");

    ctx.fillStyle=glass;
    ctx.beginPath();
    ctx.moveTo(lb.x,lb.y);
    ctx.lineTo(rb.x,rb.y);
    ctx.lineTo(rt.x,rt.y);
    ctx.lineTo(lt.x,lt.y);
    ctx.closePath();
    ctx.fill();

    // window mullions
    for(let i=1;i<9;i++){
      const q=i/9;
      const x1=lerp(lb.x,rb.x,q);
      const y1=lerp(lb.y,rb.y,q);
      const x2=lerp(lt.x,rt.x,q);
      const y2=lerp(lt.y,rt.y,q);

      ctx.strokeStyle="rgba(221,235,238,.18)";
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(x1,y1);
      ctx.lineTo(x2,y2);
      ctx.stroke();
    }
  }

  // spectator tiers and tiny crowd texture
  for(let i=1;i<=g.levels;i++){
    const hh=g.h*(i/(g.levels+1));
    const a=projectWorld(g.x-g.w*.46,g.y,hh);
    const b=projectWorld(g.x+g.w*.46,g.y,hh);

    if(!a||!b)continue;

    ctx.strokeStyle=i%2
      ?"rgba(58,77,84,.48)"
      :"rgba(250,250,248,.58)";

    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);
    ctx.stroke();

    for(let c=0;c<13;c++){
      const q=(c+.5)/13;

      const p=projectWorld(
        lerp(g.x-g.w*.43,g.x+g.w*.43,q),
        g.y,
        hh-g.h*.035
      );

      if(!p||p.forward<4)continue;

      const colors=[
        "#d9d9d4",
        "#314e5a",
        "#b33c45",
        "#315f83",
        "#d1ad54"
      ];

      ctx.fillStyle=colors[(c+i*3)%colors.length];

      ctx.beginPath();
      ctx.arc(
        p.x,
        p.y,
        clamp(p.scale*.018,.55,1.65),
        0,
        Math.PI*2
      );
      ctx.fill();
    }
  }

  // blue roof lip
  ctx.strokeStyle="rgba(39,86,122,.96)";
  ctx.lineWidth=clamp(leftBase.scale*.095,2,7);

  ctx.beginPath();
  ctx.moveTo(leftTop.x,leftTop.y);
  ctx.lineTo(rightTop.x,rightTop.y);
  ctx.stroke();
}

function drawBigScreen(s){

  const supportLeft0=
    projectWorld(s.x-s.w*.30,s.y,0);

  const supportLeft1=
    projectWorld(s.x-s.w*.30,s.y,s.supportH);

  const supportRight0=
    projectWorld(s.x+s.w*.30,s.y,0);

  const supportRight1=
    projectWorld(s.x+s.w*.30,s.y,s.supportH);

  if(
    !supportLeft0||
    !supportLeft1||
    !supportRight0||
    !supportRight1
  )return;

  if(
    Math.max(
      supportLeft0.forward,
      supportRight0.forward
    )<4
  )return;

  ctx.strokeStyle="rgba(43,53,58,.96)";
  ctx.lineWidth=
    clamp(supportLeft0.scale*.05,1.2,5);

  ctx.beginPath();

  ctx.moveTo(
    supportLeft0.x,
    supportLeft0.y
  );

  ctx.lineTo(
    supportLeft1.x,
    supportLeft1.y
  );

  ctx.moveTo(
    supportRight0.x,
    supportRight0.y
  );

  ctx.lineTo(
    supportRight1.x,
    supportRight1.y
  );

  ctx.stroke();

  const bl=
    projectWorld(
      s.x-s.w*.5,
      s.y,
      s.supportH
    );

  const br=
    projectWorld(
      s.x+s.w*.5,
      s.y,
      s.supportH
    );

  const tr=
    projectWorld(
      s.x+s.w*.5,
      s.y,
      s.supportH+s.h
    );

  const tl=
    projectWorld(
      s.x-s.w*.5,
      s.y,
      s.supportH+s.h
    );

  if(!bl||!br||!tr||!tl)return;

  ctx.save();
  ctx.globalCompositeOperation="screen";

  const glowX=
    (bl.x+br.x+tr.x+tl.x)*.25;

  const glowY=
    (bl.y+br.y+tr.y+tl.y)*.25;

  const glowR=
    Math.max(
      22,
      Math.abs(br.x-bl.x)*.72
    );

  const glow=
    ctx.createRadialGradient(
      glowX,glowY,2,
      glowX,glowY,glowR
    );

  glow.addColorStop(
    0,
    "rgba(132,218,235,.075)"
  );

  glow.addColorStop(
    1,
    "rgba(132,218,235,0)"
  );

  ctx.fillStyle=glow;

  ctx.fillRect(
    glowX-glowR,
    glowY-glowR,
    glowR*2,
    glowR*2
  );

  ctx.restore();

  ctx.fillStyle="rgba(21,28,32,.99)";

  ctx.beginPath();
  ctx.moveTo(bl.x,bl.y);
  ctx.lineTo(br.x,br.y);
  ctx.lineTo(tr.x,tr.y);
  ctx.lineTo(tl.x,tl.y);
  ctx.closePath();
  ctx.fill();

  const screenBL=
    projectWorld(
      s.x-s.w*.43,
      s.y,
      s.supportH+s.h*.08
    );

  const screenBR=
    projectWorld(
      s.x+s.w*.43,
      s.y,
      s.supportH+s.h*.08
    );

  const screenTR=
    projectWorld(
      s.x+s.w*.43,
      s.y,
      s.supportH+s.h*.91
    );

  const screenTL=
    projectWorld(
      s.x-s.w*.43,
      s.y,
      s.supportH+s.h*.91
    );

  if(
    !screenBL||
    !screenBR||
    !screenTR||
    !screenTL
  )return;

  const sg=
    ctx.createLinearGradient(
      screenTL.x,
      screenTL.y,
      screenBR.x,
      screenBR.y
    );

  sg.addColorStop(0,"#0a4055");
  sg.addColorStop(.5,"#158eb4");
  sg.addColorStop(1,"#073346");

  ctx.fillStyle=sg;

  ctx.beginPath();
  ctx.moveTo(screenBL.x,screenBL.y);
  ctx.lineTo(screenBR.x,screenBR.y);
  ctx.lineTo(screenTR.x,screenTR.y);
  ctx.lineTo(screenTL.x,screenTL.y);
  ctx.closePath();
  ctx.fill();

  const cx=
    (screenTL.x+screenBR.x)*.5;

  const cy=
    (screenTL.y+screenBR.y)*.5;

  const sw=
    Math.abs(screenBR.x-screenBL.x);

  const sh=
    Math.abs(screenBL.y-screenTL.y);

  ctx.strokeStyle=
    "rgba(235,252,255,.83)";

  ctx.lineWidth=1.4;

  ctx.beginPath();
  ctx.ellipse(
    cx,cy,
    sw*.27,
    sh*.18,
    0,
    0,
    Math.PI*2
  );
  ctx.stroke();

  for(let i=0;i<3;i++){

    const a=
      clock*(.55+i*.035)+i*2.0;

    const px=
      cx+Math.cos(a)*sw*.27;

    const py=
      cy+Math.sin(a)*sh*.18;

    ctx.fillStyle=
      i===0
      ?"#fff"
      :i===1
      ?"#e62a3a"
      :"#f2d34b";

    ctx.beginPath();

    ctx.arc(
      px,
      py,
      clamp(sw*.014,1.2,3),
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.fillStyle=
    "rgba(3,25,35,.72)";

  ctx.fillRect(
    Math.min(screenTL.x,screenBL.x),
    Math.min(screenTL.y,screenTR.y),
    sw,
    Math.max(3,sh*.16)
  );

  ctx.fillStyle=
    "rgba(255,255,255,.9)";

  ctx.font=
    `900 ${clamp(sw*.045,7,15)}px sans-serif`;

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    "RACE VISION",
    cx,
    Math.min(screenTL.y,screenTR.y)
      +Math.max(3,sh*.08)
  );
}

function drawControlTower(t){

  const b1=
    projectWorld(t.x-t.w*.5,t.y,0);

  const b2=
    projectWorld(t.x+t.w*.5,t.y,0);

  const p2=
    projectWorld(t.x+t.w*.5,t.y,t.h);

  const p1=
    projectWorld(t.x-t.w*.5,t.y,t.h);

  if(!b1||!b2||!p1||!p2)return;

  if(
    Math.max(
      b1.forward,
      b2.forward
    )<4
  )return;

  ctx.fillStyle=
    "rgba(230,236,238,.97)";

  ctx.beginPath();
  ctx.moveTo(b1.x,b1.y);
  ctx.lineTo(b2.x,b2.y);
  ctx.lineTo(p2.x,p2.y);
  ctx.lineTo(p1.x,p1.y);
  ctx.closePath();
  ctx.fill();

  const w1=
    projectWorld(
      t.x-t.w*.42,
      t.y,
      t.h*.58
    );

  const w2=
    projectWorld(
      t.x+t.w*.42,
      t.y,
      t.h*.58
    );

  const w3=
    projectWorld(
      t.x+t.w*.42,
      t.y,
      t.h*.79
    );

  const w4=
    projectWorld(
      t.x-t.w*.42,
      t.y,
      t.h*.79
    );

  if(w1&&w2&&w3&&w4){

    ctx.fillStyle=

    ctx.moveTo(w1.x,w1.y);
    ctx.lineTo(w2.x,w2.y);
    ctx.lineTo(w3.x,w3.y);
    ctx.lineTo(w4.x,w4.y);
    ctx.closePath();
    ctx.fill();
  }
}

function drawFlag(f,index){

  const base=
    projectWorld(f.x,f.y,0);

  const top=
    projectWorld(f.x,f.y,f.h);

  if(!base||!top||base.forward<3)return;

  ctx.strokeStyle=
    "rgba(40,52,58,.82)";

  ctx.lineWidth=1.2;

  ctx.beginPath();
  ctx.moveTo(base.x,base.y);
  ctx.lineTo(top.x,top.y);
  ctx.stroke();

  const dir=
    index%2===0?1:-1;

  const flagW=
    clamp(base.scale*.18,3,11);

  const flagH=
    flagW*.55;

  ctx.fillStyle=
    index%3===0
    ?"#d9233e"
    :index%3===1
    ?"#f4f4f4"
    :"#1d6a9a";

  ctx.beginPath();
  ctx.moveTo(top.x,top.y);

  ctx.lineTo(
    top.x+dir*flagW,
    top.y+flagH*.25
  );

  ctx.lineTo(
    top.x,
    top.y+flagH
  );

  ctx.closePath();
  ctx.fill();
}

function drawTreeCluster(x,y,w,h,seed){

  const base=
    projectWorld(x,y,0);

  if(!base||base.forward<4)return;

  for(let i=0;i<7;i++){

    const rx=
      ((i*17+seed*13)%11)/10-.5;

    const rh=
      ((i*29+seed*7)%9)/8;

    const p=projectWorld(
      x+rx*w*.65,
      y,
      h*(.55+.40*rh)
    );
