<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BOAT RACER 操作テスト v9</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  touch-action:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#071c2b;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

#start{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(#45bfe7,#08799f);
  color:#fff;
  text-align:center;
}

.card{
  margin:18px;
  padding:24px 30px;
  max-width:560px;
  border-radius:20px;
  background:rgba(3,35,53,.88);
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.card h1{
  margin:0 0 8px;
  font-size:clamp(32px,6vw,58px);
}

.card h2{
  margin:0 0 10px;
  font-size:clamp(20px,3vw,30px);
}

.card p{
  margin:0 0 18px;
  line-height:1.55;
}

button{
  border:0;
  border-radius:13px;
  font-weight:900;
}

#startBtn{
  padding:15px 28px;
  font-size:21px;
  background:#fff;
  color:#075d7c;
}

#ui{
  display:none;
  position:fixed;
  inset:0;
  color:#fff;
  text-shadow:0 2px 4px rgba(0,20,35,.9);
  pointer-events:none;
}

#badge{
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  padding:7px 14px;
  border-radius:10px;
  background:rgba(4,37,56,.82);
  font-weight:900;
  white-space:nowrap;
}

#speed{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  padding:4px 10px;
  border-radius:10px;
  background:rgba(4,37,56,.62);
  font-size:clamp(24px,4vw,42px);
  font-weight:900;
}

#resetBtn{
  position:absolute;
  top:10px;
  right:14px;
  padding:9px 12px;
  background:rgba(255,255,255,.92);
  color:#064b65;
  pointer-events:auto;
}

#throttle{
  position:absolute;
  left:10px;
  top:24%;
  width:120px;
  height:56%;
  pointer-events:auto;
}

#throttleLabel{
  position:absolute;
  top:-30px;
  left:50%;
  transform:translateX(-50%);
  font-weight:900;
}

#throttleTrack{
  position:absolute;
  left:50%;
  top:0;
  bottom:0;
  width:24px;
  transform:translateX(-50%);
  border:2px solid #fff;
  border-radius:14px;
  background:rgba(2,31,48,.58);
}

#throttleKnob{
  position:absolute;
  left:50%;
  bottom:0;
  width:72px;
  height:44px;
  transform:translate(-50%,50%);
  background:#f1f1f1;
  border:4px solid #555;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,.28);
}

#steer{
  position:absolute;
  right:10px;
  bottom:18px;
  width:min(38vw,340px);
  height:140px;
  pointer-events:auto;
}

#steerLabel{
  position:absolute;
  top:5px;
  left:50%;
  transform:translateX(-50%);
  font-weight:900;
  white-space:nowrap;
}

#steerTrack{
  position:absolute;
  left:0;
  right:0;
  top:78px;
  height:24px;
  border:2px solid #fff;
  border-radius:14px;
  background:rgba(2,31,48,.58);
}

#steerKnob{
  position:absolute;
  left:50%;
  top:90px;
  width:68px;
  height:68px;
  transform:translate(-50%,-50%);
  background:#f1f1f1;
  border:6px solid #555;
  border-radius:50%;
  box-shadow:0 4px 10px rgba(0,0,0,.28);
}

#hint{
  position:absolute;
  top:50px;
  left:50%;
  transform:translateX(-50%);
  padding:4px 8px;
  border-radius:8px;
  background:rgba(4,37,56,.55);
  font-size:12px;
  white-space:nowrap;
}

#portrait{
  display:none;
  position:fixed;
  z-index:99;
  inset:0;
  align-items:center;
  justify-content:center;
  padding:30px;
  background:#071b29;
  color:#fff;
  text-align:center;
  font-size:22px;
}

@media(orientation:portrait){
  #portrait{display:flex}
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="start">
  <div class="card">
    <h1>🚤 BOAT RACER</h1>
    <h2>操作テスト v9</h2>
    <p>
      追従視点＋ターンマーク当たり判定。<br>
      操作物理はv8を土台にしています。
    </p>
    <button id="startBtn">スタート</button>
  </div>
</div>

<div id="ui">
  <div id="badge">BOAT RACER 操作テスト v9</div>
  <div id="hint">艇の後ろから追う視点 / ターンマークは貫通不可</div>
  <div id="speed">0.0 km/h</div>

  <button id="resetBtn">リセット</button>

  <div id="throttle">
    <div id="throttleLabel">アクセル</div>
    <div id="throttleTrack"></div>
    <div id="throttleKnob"></div>
  </div>

  <div id="steer">
    <div id="steerLabel">← 左　ハンドル　右 →</div>
    <div id="steerTrack"></div>
    <div id="steerKnob"></div>
  </div>
</div>

<div id="portrait">📱 iPhoneを横向きにしてプレイ</div>

<script>
"use strict";

const $ = id => document.getElementById(id);
const canvas = $("game");
const ctx = canvas.getContext("2d");

const clamp = (v,min,max) => Math.max(min,Math.min(max,v));
const lerp = (a,b,t) => a + (b-a)*t;

function lerpAngle(a,b,t){
  let d = b-a;
  d = Math.atan2(Math.sin(d),Math.cos(d));
  return a + d*t;
}

let W = innerWidth;
let H = innerHeight;
let DPR = 1;
let running = false;
let throttle = 0;
let steering = 0;
let lastTime = performance.now();

const WORLD = {
  width: 1800,
  height: 900
};

const marks = [
  {x:650, y:450, r:34},
  {x:1150, y:450, r:34}
];

const boat = {
  x:480,
  y:650,
  angle:0,
  vx:0,
  vy:0,
  yaw:0,
  engine:0,
  radius:22
};

const camera = {
  x:boat.x,
  y:boat.y,
  angle:boat.angle
};

function resize(){
  W = innerWidth;
  H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1,2);

  canvas.width = Math.round(W*DPR);
  canvas.height = Math.round(H*DPR);

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

function resetBoat(){
  throttle = 0;
  steering = 0;

  boat.x = 480;
  boat.y = 650;
  boat.angle = 0;
  boat.vx = 0;
  boat.vy = 0;
  boat.yaw = 0;
  boat.engine = 0;

  camera.x = boat.x;
  camera.y = boat.y;
  camera.angle = boat.angle;

  $("throttleKnob").style.bottom = "0%";
  $("steerKnob").style.left = "50%";
  $("speed").textContent = "0.0 km/h";
}

addEventListener("resize",resize);
resize();

$("startBtn").addEventListener("click",()=>{
  $("start").style.display = "none";
  $("ui").style.display = "block";
  running = true;
  resetBoat();
});

$("resetBtn").addEventListener("click",resetBoat);

const throttleArea = $("throttle");
const throttleKnob = $("throttleKnob");
const steerArea = $("steer");
const steerKnob = $("steerKnob");

function setThrottleFromY(clientY){
  const rect = throttleArea.getBoundingClientRect();

  throttle = clamp(
    1 - (clientY-rect.top)/rect.height,
    0,
    1
  );

  throttleKnob.style.bottom = `${throttle*100}%`;
}

function setSteeringFromX(clientX){
  const rect = steerArea.getBoundingClientRect();

  steering = clamp(
    (((clientX-rect.left)/rect.width)-0.5)*2,
    -1,
    1
  );

  steerKnob.style.left = `${50 + steering*45}%`;
}

function releaseSteering(){
  steering = 0;
  steerKnob.style.left = "50%";
}

throttleArea.addEventListener("pointerdown",e=>{
  throttleArea.setPointerCapture(e.pointerId);
  setThrottleFromY(e.clientY);
});

throttleArea.addEventListener("pointermove",e=>{
  if(e.buttons || e.pointerType==="touch"){
    setThrottleFromY(e.clientY);
  }
});

steerArea.addEventListener("pointerdown",e=>{
  steerArea.setPointerCapture(e.pointerId);
  setSteeringFromX(e.clientX);
});

steerArea.addEventListener("pointermove",e=>{
  if(e.buttons || e.pointerType==="touch"){
    setSteeringFromX(e.clientX);
  }
});

steerArea.addEventListener("pointerup",releaseSteering);
steerArea.addEventListener("pointercancel",releaseSteering);

function collideWithMark(mark){
  const dx = boat.x - mark.x;
  const dy = boat.y - mark.y;
  const dist = Math.hypot(dx,dy);
  const minDist = boat.radius + mark.r;

  if(dist >= minDist){
    return;
  }

  let nx;
  let ny;

  if(dist < 0.0001){
    nx = -Math.cos(boat.angle);
    ny = -Math.sin(boat.angle);
  }else{
    nx = dx/dist;
    ny = dy/dist;
  }

  boat.x = mark.x + nx*minDist;
  boat.y = mark.y + ny*minDist;

  const inward = boat.vx*nx + boat.vy*ny;

  if(inward < 0){
    boat.vx -= inward*nx;
    boat.vy -= inward*ny;
  }

  boat.vx *= 0.42;
  boat.vy *= 0.42;
  boat.engine *= 0.62;
  boat.yaw *= 0.55;
}

function updatePhysics(dt){
  if(!running) return;

  const MAX_SPEED = 250;

  const targetEngine = throttle*MAX_SPEED;

  const engineResponse =
    targetEngine > boat.engine
    ? 1.05
    : 2.3;

  boat.engine +=
    (targetEngine-boat.engine) *
    Math.min(1,engineResponse*dt);

  const speedRatio = clamp(boat.engine/MAX_SPEED,0,1);
  const steerAmount = Math.abs(steering);

  const targetYaw =
    steering *
    (0.34 + 0.92*speedRatio);

  const yawResponse =
    steerAmount < 0.02
    ? 3.6
    : 2.2;

  boat.yaw +=
    (targetYaw-boat.yaw) *
    Math.min(1,yawResponse*dt);

  if(steerAmount < 0.02){
    boat.yaw *= Math.pow(0.28,dt);
  }

  boat.angle += boat.yaw*dt;

  const turnLoss =
    1 -
    steerAmount *
    speedRatio *
    0.24;

  const forwardSpeed =
    boat.engine *
    turnLoss;

  const hx = Math.cos(boat.angle);
  const hy = Math.sin(boat.angle);

  const targetVX = hx*forwardSpeed;
  const targetVY = hy*forwardSpeed;

  const slip =
    steerAmount *
    speedRatio;

  const grip =
    3.7 -
    2.45*slip;

  boat.vx +=
    (targetVX-boat.vx) *
    Math.min(1,grip*dt);

  boat.vy +=
    (targetVY-boat.vy) *
    Math.min(1,grip*dt);

  const waterDrag =
    Math.max(
      0,
      1 -
      (0.04 + slip*0.11)*dt
    );

  boat.vx *= waterDrag;
  boat.vy *= waterDrag;

  boat.x += boat.vx*dt;
  boat.y += boat.vy*dt;

  const margin = 35;

  if(boat.x < margin){
    boat.x = margin;
    boat.vx = Math.max(0,boat.vx)*0.3;
  }

  if(boat.x > WORLD.width-margin){
    boat.x = WORLD.width-margin;
    boat.vx = Math.min(0,boat.vx)*0.3;
  }

  if(boat.y < margin){
    boat.y = margin;
    boat.vy = Math.max(0,boat.vy)*0.3;
  }

  if(boat.y > WORLD.height-margin){
    boat.y = WORLD.height-margin;
    boat.vy = Math.min(0,boat.vy)*0.3;
  }

  for(const mark of marks){
    collideWithMark(mark);
  }

  const actualSpeed = Math.hypot(boat.vx,boat.vy);

  $("speed").textContent =
    `${(actualSpeed/MAX_SPEED*82).toFixed(1)} km/h`;
}

function updateCamera(dt){
  const backDistance = 135;

  const targetX =
    boat.x -
    Math.cos(boat.angle)*backDistance;

  const targetY =
    boat.y -
    Math.sin(boat.angle)*backDistance;

  const posFollow = 1 - Math.pow(0.0018,dt);
  const angFollow = 1 - Math.pow(0.005,dt);

  camera.x = lerp(camera.x,targetX,posFollow);
  camera.y = lerp(camera.y,targetY,posFollow);
  camera.angle = lerpAngle(camera.angle,boat.angle,angFollow);
}

function worldToScreen(x,y){
  const dx = x-camera.x;
  const dy = y-camera.y;

  const ca = Math.cos(-camera.angle);
  const sa = Math.sin(-camera.angle);

  const rx = dx*ca - dy*sa;
  const ry = dx*sa + dy*ca;

  const sx = W*0.5 - ry;
  const sy = H*0.72 - rx;

  return {x:sx,y:sy};
}

function drawWater(){
  const grad =
    ctx.createLinearGradient(
      0,0,0,H
    );

  grad.addColorStop(0,"#2ab1d6");
  grad.addColorStop(1,"#08799f");

  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  const t = performance.now()/1000;

  ctx.strokeStyle = "rgba(255,255,255,.10)";
  ctx.lineWidth = 1;

  for(let y=15;y<H;y+=28){
    ctx.beginPath();

    for(let x=0;x<=W;x+=34){
      const yy =
        y +
        Math.sin(
          x*0.04 +
          y*0.02 +
          t
        )*3;

      if(x===0){
        ctx.moveTo(x,yy);
      }else{
        ctx.lineTo(x,yy);
      }
    }

    ctx.stroke();
  }
}

function drawCourse(){
  const points = [];

  const leftX = 650;
  const rightX = 1150;
  const bottomY = 650;
  const topY = 250;
  const centerY = 450;

  for(let i=0;i<=24;i++){
    const t=i/24;
    points.push({
      x:lerp(leftX,rightX,t),
      y:bottomY
    });
  }

  for(let i=1;i<=30;i++){
    const a = Math.PI/2 - (Math.PI*i/30);

    points.push({
      x:rightX + 200*Math.cos(a),
      y:centerY + 200*Math.sin(a)
    });
  }

  for(let i=1;i<=24;i++){
    const t=i/24;

    points.push({
      x:lerp(rightX,leftX,t),
      y:topY
    });
  }

  for(let i=1;i<=30;i++){
    const a = -Math.PI/2 - (Math.PI*i/30);

    points.push({
      x:leftX + 200*Math.cos(a),
      y:centerY + 200*Math.sin(a)
    });
  }

  ctx.strokeStyle = "rgba(255,255,255,.21)";
  ctx.lineWidth = 2;
  ctx.setLineDash([9,11]);

  ctx.beginPath();

  points.forEach((p,i)=>{
    const s=worldToScreen(p.x,p.y);

    if(i===0){
      ctx.moveTo(s.x,s.y);
    }else{
      ctx.lineTo(s.x,s.y);
    }
  });

  ctx.closePath();
  ctx.stroke();
  ctx.setLineDash([]);

  for(const mark of marks){
    drawMark(mark);
  }
}

function drawMark(mark){
  const p = worldToScreen(mark.x,mark.y);

  if(
    p.x < -100 ||
    p.x > W+100 ||
    p.y < -100 ||
    p.y > H+100
  ){
    return;
  }

  const dx = mark.x-camera.x;
  const dy = mark.y-camera.y;
  const dist = Math.hypot(dx,dy);

  const scale =
    clamp(
      1.35 - dist/1200,
      0.58,
      1.15
    );

  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.scale(scale,scale);

  ctx.fillStyle = "rgba(0,0,0,.20)";
  ctx.beginPath();
  ctx.ellipse(5,10,30,12,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#ffd21c";
  ctx.beginPath();
  ctx.arc(0,0,26,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 4;
  ctx.stroke();

  ctx.fillStyle = "#e53935";
  ctx.beginPath();
  ctx.arc(0,0,10,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function drawWake(){
  const speed = Math.hypot(boat.vx,boat.vy);

  if(speed < 12) return;

  const travelAngle =
    Math.atan2(
      boat.vy,
      boat.vx
    );

  const back =
    travelAngle +
    Math.PI;

  const wakeStart1 = {
    x:boat.x + Math.cos(back+0.24)*24,
    y:boat.y + Math.sin(back+0.24)*24
  };

  const wakeEnd1 = {
    x:boat.x + Math.cos(back+0.24)*(70 + speed*0.18),
    y:boat.y + Math.sin(back+0.24)*(70 + speed*0.18)
  };

  const wakeStart2 = {
    x:boat.x + Math.cos(back-0.24)*24,
    y:boat.y + Math.sin(back-0.24)*24
  };

  const wakeEnd2 = {
    x:boat.x + Math.cos(back-0.24)*(70 + speed*0.18),
    y:boat.y + Math.sin(back-0.24)*(70 + speed*0.18)
  };

  const a1=worldToScreen(wakeStart1.x,wakeStart1.y);
  const b1=worldToScreen(wakeEnd1.x,wakeEnd1.y);
  const a2=worldToScreen(wakeStart2.x,wakeStart2.y);
  const b2=worldToScreen(wakeEnd2.x,wakeEnd2.y);

  ctx.strokeStyle = "rgba(255,255,255,.58)";
  ctx.lineWidth = 3;

  ctx.beginPath();
  ctx.moveTo(a1.x,a1.y);
  ctx.lineTo(b1.x,b1.y);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(a2.x,a2.y);
  ctx.lineTo(b2.x,b2.y);
  ctx.stroke();
}

function drawBoat(){
  const p = worldToScreen(boat.x,boat.y);

  const relativeAngle =
    boat.angle -
    camera.angle;

  const screenAngle =
    relativeAngle -
    Math.PI/2;

  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(screenAngle);

  ctx.scale(1.45,1.45);

  ctx.shadowColor = "rgba(0,0,0,.28)";
  ctx.shadowBlur = 8;

  ctx.fillStyle = "#d81f3a";
  ctx.beginPath();
  ctx.moveTo(30,0);
  ctx.lineTo(-16,-12);
  ctx.lineTo(-23,0);
  ctx.lineTo(-16,12);
  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur = 0;

  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.moveTo(18,0);
  ctx.lineTo(-7,-7);
  ctx.lineTo(-7,7);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#222";
  ctx.beginPath();
  ctx.arc(-5,0,4,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function drawHorizonShade(){
  const grad =
    ctx.createLinearGradient(
      0,0,0,H*0.55
    );

  grad.addColorStop(
    0,
    "rgba(0,45,67,.35)"
  );

  grad.addColorStop(
    1,
    "rgba(0,45,67,0)"
  );

  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H*0.55);
}

function loop(now){
  const dt =
    Math.min(
      0.035,
      (now-lastTime)/1000
    );

  lastTime = now;

  updatePhysics(dt);
  updateCamera(dt);

  drawWater();
  drawHorizonShade();
  drawCourse();
  drawWake();
  drawBoat();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
