<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BOAT RACER v14</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061722;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
#start{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:linear-gradient(#68d3f0,#087da8);color:#fff;text-align:center}
.card{width:min(88vw,520px);padding:24px;border-radius:22px;background:rgba(3,28,43,.92);box-shadow:0 16px 40px #0005}.card h1{margin:0 0 6px;font-size:44px}.card h2{margin:0 0 12px}.card p{line-height:1.55}.card button{padding:14px 28px;border:0;border-radius:12px;font-size:20px;font-weight:900;color:#075f7d;background:#fff}
#ui{display:none;position:fixed;inset:0;color:#fff;pointer-events:none;text-shadow:0 2px 5px #001a27}
#top{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.badge{padding:6px 10px;border-radius:9px;background:#052337a8;border:1px solid #ffffff2c;font-size:12px;font-weight:900;white-space:nowrap}
#reset{position:absolute;right:9px;top:8px;border:0;border-radius:10px;padding:9px 11px;font-weight:900;color:#064a62;background:#fffffff0;pointer-events:auto}
#speedbox{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);min-width:155px;padding:7px 14px;text-align:center;border-radius:14px;background:#031c2bd9;border:1px solid #ffffff2b}
#speed{font-size:36px;font-weight:950;line-height:1}#speed small{font-size:15px;margin-left:5px}#state{font-size:11px;margin-top:5px;font-weight:900}
#throttle{position:absolute;left:8px;top:22%;width:108px;height:56%;pointer-events:auto}#tlab{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900}#ttrack{position:absolute;left:50%;top:0;bottom:0;width:18px;transform:translateX(-50%);border:2px solid #fff;border-radius:12px;background:#06213399}#tfill{position:absolute;left:50%;bottom:0;width:8px;height:0;transform:translateX(-50%);border-radius:8px;background:#7ce6f8;box-shadow:0 0 12px #7ce6f8}#tknob{position:absolute;left:50%;bottom:0;width:66px;height:38px;transform:translate(-50%,50%);border:4px solid #37434a;border-radius:9px;background:#eee}
#steer{position:absolute;right:8px;bottom:14px;width:min(38vw,350px);height:130px;pointer-events:auto}#slab{position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;white-space:nowrap}#strack{position:absolute;left:0;right:0;top:67px;height:18px;border:2px solid #fff;border-radius:12px;background:#06213399}#sknob{position:absolute;left:50%;top:76px;width:62px;height:62px;transform:translate(-50%,-50%);border:5px solid #37434a;border-radius:50%;background:#eee}
#portrait{display:none;position:fixed;z-index:99;inset:0;align-items:center;justify-content:center;background:#071822;color:white;font-size:22px}@media(orientation:portrait){#portrait{display:flex}}
</style></head><body>

<canvas id="game"></canvas>

<div id="start">
  <div class="card">
    <h1>🚤 BOAT RACER</h1>
    <h2>操作テスト v14</h2>
    <p>v13のハンドル・周回方向は維持。<br>動画寄りの低い艇上視点。</p>
    <button id="go">スタート</button>
  </div>
</div>

<div id="ui">
  <div id="top">
    <div class="badge">BOAT RACER v14</div>
    <div class="badge">下→　右↑　上←　左↓</div>
  </div>

  <button id="reset">リセット</button>

  <div id="speedbox">
    <div id="speed">0.0<small>km/h</small></div>
    <div id="state">舵：中央</div>
  </div>

  <div id="throttle">
    <div id="tlab">アクセル</div>
    <div id="ttrack"></div>
    <div id="tfill"></div>
    <div id="tknob"></div>
  </div>

  <div id="steer">
    <div id="slab">← 左　ハンドル　右 →</div>
    <div id="strack"></div>
    <div id="sknob"></div>
  </div>
</div>

<div id="portrait">📱 iPhoneを横向きにしてプレイ</div>

<script>
"use strict";

const $=id=>document.getElementById(id);
const c=$("game");
const x=c.getContext("2d");

const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const lp=(a,b,t)=>a+(b-a)*t;
const la=(a,b,t)=>a+Math.atan2(Math.sin(b-a),Math.cos(b-a))*t;

let W=innerWidth;
let H=innerHeight;
let D=1;
let last=performance.now();
let run=false;
let thr=0;
let steer=0;
let t=0;

const world={w:1800,h:900};

const course={
  lx:650,
  rx:1150,
  cy:450,
  by:650,
  ty:250,
  r:200
};

const marks=[
  {x:course.lx,y:course.cy,r:38},
  {x:course.rx,y:course.cy,r:38}
];

const b={
  x:470,
  y:course.by,
  a:0,
  vx:0,
  vy:0,
  yaw:0,
  eng:0,
  r:22
};

const cam={
  x:b.x,
  y:b.y,
  a:b.a,
  roll:0,
  bob:0,
  sx:0,
  sy:0
};

function resize(){
  W=innerWidth;
  H=innerHeight;
  D=Math.min(devicePixelRatio||1,2);

  c.width=W*D;
  c.height=H*D;

  x.setTransform(D,0,0,D,0,0);
}

addEventListener("resize",resize);
resize();

function reset(){
  thr=0;
  steer=0;

  Object.assign(b,{
    x:470,
    y:course.by,
    a:0,
    vx:0,
    vy:0,
    yaw:0,
    eng:0
  });

  Object.assign(cam,{
    x:b.x,
    y:b.y,
    a:b.a,
    roll:0,
    bob:0,
    sx:0,
    sy:0
  });

  $("tknob").style.bottom="0%";
  $("tfill").style.height="0%";
  $("sknob").style.left="50%";
  $("speed").innerHTML='0.0<small>km/h</small>';
  $("state").textContent="舵：中央";
}

$("go").onclick=()=>{
  $("start").style.display="none";
  $("ui").style.display="block";
  run=true;
  last=performance.now();
  reset();
};

$("reset").onclick=reset;

const ta=$("throttle");
const sa=$("steer");

function setThr(y){
  const r=ta.getBoundingClientRect();

  thr=cl(
    1-(y-r.top)/r.height,
    0,
    1
  );

  $("tknob").style.bottom=thr*100+"%";
  $("tfill").style.height=thr*100+"%";
}

function setSteer(px){
  const r=sa.getBoundingClientRect();

  steer=cl(
    (((px-r.left)/r.width)-.5)*2,
    -1,
    1
  );

  $("sknob").style.left=
    50+steer*45+"%";

  $("state").textContent=
    steer<-.08
    ?"舵：左 ←"
    :steer>.08
    ?"舵：右 →"
    :"舵：中央";
}

function center(){
  steer=0;
  $("sknob").style.left="50%";
  $("state").textContent="舵：中央";
}

ta.onpointerdown=e=>{
  ta.setPointerCapture(e.pointerId);
  setThr(e.clientY);
};

ta.onpointermove=e=>{
  if(e.buttons||e.pointerType==="touch"){
    setThr(e.clientY);
  }
};

sa.onpointerdown=e=>{
  sa.setPointerCapture(e.pointerId);
  setSteer(e.clientX);
};

sa.onpointermove=e=>{
  if(e.buttons||e.pointerType==="touch"){
    setSteer(e.clientX);
  }
};

sa.onpointerup=center;
sa.onpointercancel=center;

function hit(m){
  let dx=b.x-m.x;
  let dy=b.y-m.y;
  let d=Math.hypot(dx,dy);
  let mn=b.r+m.r;

  if(d>=mn)return;

  let nx=
    d>.001
    ?dx/d
    :-Math.cos(b.a);

  let ny=
    d>.001
    ?dy/d
    :-Math.sin(b.a);

  b.x=m.x+nx*mn;
  b.y=m.y+ny*mn;

  let vn=
    b.vx*nx+
    b.vy*ny;

  if(vn<0){
    b.vx-=vn*nx;
    b.vy-=vn*ny;
  }

  b.vx*=.4;
  b.vy*=.4;
  b.eng*=.58;
  b.yaw*=.52;
}

function physics(dt){
  if(!run)return;

  const MAX=250;

  const target=
    thr*MAX;

  const res=
    target>b.eng
    ?1.05
    :2.3;

  b.eng+=
    (target-b.eng)*
    Math.min(1,res*dt);

  const sr=
    cl(
      b.eng/MAX,
      0,
      1
    );

  const as=
    Math.abs(steer);

  const ty=
    steer*
    (.34+.92*sr);

  const yr=
    as<.02
    ?3.6
    :2.2;

  b.yaw+=
    (ty-b.yaw)*
    Math.min(1,yr*dt);

  if(as<.02){
    b.yaw*=
      Math.pow(
        .28,
        dt
      );
  }

  b.a+=
    b.yaw*
    dt;

  const forward=
    b.eng*
    (1-as*sr*.24);

  const hx=
    Math.cos(b.a);

  const hy=
    Math.sin(b.a);

  const slip=
    as*
    sr;

  const grip=
    3.7-
    2.45*
    slip;

  b.vx+=
    (hx*forward-b.vx)*
    Math.min(1,grip*dt);

  b.vy+=
    (hy*forward-b.vy)*
    Math.min(1,grip*dt);

  const drag=
    Math.max(
      0,
      1-(.04+.11*slip)*dt
    );

  b.vx*=drag;
  b.vy*=drag;

  b.x+=
    b.vx*
    dt;

  b.y+=
    b.vy*
    dt;

  const m=35;

  if(b.x<m){
    b.x=m;
    b.vx=0;
  }

  if(b.x>world.w-m){
    b.x=world.w-m;
    b.vx=0;
  }

  if(b.y<m){
    b.y=m;
    b.vy=0;
  }

  if(b.y>world.h-m){
    b.y=world.h-m;
    b.vy=0;
  }

  marks.forEach(hit);

  $("speed").innerHTML=
    (
      Math.hypot(
        b.vx,
        b.vy
      )/MAX*82
    ).toFixed(1)
    +
    '<small>km/h</small>';
}

function camera(dt){
  const sp=
    Math.hypot(
      b.vx,
      b.vy
    );

  const sr=
    cl(
      sp/250,
      0,
      1
    );

  const f=18;

  const tx=
    b.x-
    Math.cos(b.a)*f;

  const ty=
    b.y-
    Math.sin(b.a)*f;

  cam.x=
    lp(
      cam.x,
      tx,
      1-Math.exp(-11*dt)
    );

  cam.y=
    lp(
      cam.y,
      ty,
      1-Math.exp(-11*dt)
    );

  cam.a=
    la(
      cam.a,
      b.a,
      1-Math.exp(-7.5*dt)
    );

  cam.roll=
    lp(
      cam.roll,
      cl(
        -b.yaw*
        (.16+.40*sr),
        -.115,
        .115
      ),
      1-Math.exp(-4.8*dt)
    );

  let bob=
    Math.sin(t*7.7)*
    (.8+2*sr)
    +
    Math.sin(t*13.2)*
    (.35+.7*sr);

  cam.bob=
    lp(
      cam.bob,
      bob,
      1-Math.exp(-8*dt)
    );

  let q=
    sr*
    sr*
    1.1;

  cam.sx=
    Math.sin(t*23)*
    q;

  cam.sy=
    Math.cos(t*19)*
    q*
    .7;
}

function cs(px,py){
  let dx=
    px-cam.x;

  let dy=
    py-cam.y;

  let ca=
    Math.cos(cam.a);

  let sa=
    Math.sin(cam.a);

  return{
    f:
      dx*ca+
      dy*sa,

    r:
      -dx*sa+
      dy*ca
  };
}

function proj(px,py,h=0){
  let p=
    cs(
      px,
      py
    );

  if(p.f<-32){
    return null;
  }

  let hor=
    H*.315+
    cam.bob+
    cam.sy;

  let F=
    Math.max(
      420,
      W*.72
    );

  let z=
    Math.max(
      36,
      p.f+72
    );

  let sc=
    F/z;

  let sx=
    W*.5+
    p.r*sc+
    cam.sx;

  let sy=
    hor+
    (54-h)*sc;

  let dx=
    sx-W*.5;

  let dy=
    sy-hor;

  let cr=
    Math.cos(cam.roll);

  let sr=
    Math.sin(cam.roll);

  return{
    x:
      W*.5+
      dx*cr-
      dy*sr,

    y:
      hor+
      dx*sr+
      dy*cr,

    sc,
    f:p.f
  };
}

function sky(){
  let hor=
    H*.315+
    cam.bob+
    cam.sy;

  let g=
    x.createLinearGradient(
      0,
      0,
      0,
      hor
    );

  g.addColorStop(
    0,
    "#58c0e9"
  );

  g.addColorStop(
    .55,
    "#91dbf4"
  );

  g.addColorStop(
    1,
    "#e5f9ff"
  );

  x.fillStyle=g;

  x.fillRect(
    0,
    0,
    W,
    hor+2
  );

  x.save();

  x.globalAlpha=.5;

  x.fillStyle="#fff";

  let drift=
    (t*5)%W;

  for(let i=-1;i<5;i++){
    let px=
      i*260+
      120-
      drift*.15;

    let py=
      55+
      (i%2)*25;

    x.beginPath();
    x.ellipse(px,py,72,18,0,0,7);
    x.ellipse(px+45,py-7,40,19,0,0,7);
    x.ellipse(px-42,py+3,36,15,0,0,7);
    x.fill();
  }

  x.restore();
}

function shore(){
  let h=
    H*.315+
    cam.bob+
    cam.sy;

  x.fillStyle="#335b6a";

  x.fillRect(
    0,
    h-3,
    W,
    12
  );

  x.fillStyle="#526f7a";

  x.beginPath();
  x.moveTo(0,h-26);
  x.lineTo(W*.16,h-38);
  x.lineTo(W*.30,h-26);
  x.lineTo(W*.45,h-46);
  x.lineTo(W*.62,h-31);
  x.lineTo(W*.79,h-43);
  x.lineTo(W,h-29);
  x.lineTo(W,h);
  x.lineTo(0,h);
  x.fill();

  x.fillStyle=
    "#eef7fac7";

  for(let i=0;i<5;i++){
    let bw=
      W*.11;

    let bx=
      (
        (
          i*W*.24+
          90+
          Math.sin(cam.a)*35
        )%
        (W+200)
      )-
      100;

    let bh=
      18+
      (i%3)*11;

    x.fillRect(
      bx,
      h-6-bh,
      bw,
      bh
    );
  }
}

function water(){
  let h=
    H*.315+
    cam.bob+
    cam.sy;

  let g=
    x.createLinearGradient(
      0,
      h,
      0,
      H
    );

  g.addColorStop(
    0,
    "#54c4e6"
  );

  g.addColorStop(
    .28,
    "#169fc9"
  );

  g.addColorStop(
    1,
    "#067397"
  );

  x.fillStyle=g;

  x.fillRect(
    0,
    h,
    W,
    H-h
  );

  let sr=
    cl(
      Math.hypot(
        b.vx,
        b.vy
      )/250,
      0,
      1
    );

  x.lineWidth=1;

  for(let i=0;i<22;i++){
    let q=
      i/21;

    let yy=
      h+
      (H-h)*
      Math.pow(
        q,
        1.72
      );

    let amp=
      1+
      q*4.5;

    x.strokeStyle=
      `rgba(255,255,255,${.06+q*.12})`;

    x.beginPath();

    for(let px=-20;px<=W+20;px+=32){
      let wv=
        Math.sin(
          px*.025+
          i*.83+
          t*
          (1.6+sr*2.6)
        )*
        amp;

      if(px===-20){
        x.moveTo(
          px,
          yy+wv
        );
      }else{
        x.lineTo(
          px,
          yy+wv
        );
      }
    }

    x.stroke();
  }

  if(sr>.06){
    x.save();

    x.globalAlpha=
      .08+
      sr*.16;

    x.strokeStyle=
      "#e8fdff";

    for(let i=0;i<14;i++){
      let px=
        (
          i*97.3+
          t*100*
          (.4+sr)
        )%
        W;

      let sy=
        h+
        30+
        (
          (i*43)%
          Math.max(
            80,
            H-h-100
          )
        );

      let len=
        18+
        sr*55;

      x.beginPath();

      x.moveTo(
        px,
        sy
      );

      x.lineTo(
        px+
        (px-W*.5)*.035,
        sy+len
      );

      x.stroke();
    }

    x.restore();
  }
}

function path(){
  let p=[];

  for(let i=0;i<=50;i++){
    let q=i/50;

    p.push({
      x:
        lp(
          course.lx,
          course.rx,
          q
        ),
      y:course.by
    });
  }

  for(let i=1;i<=64;i++){
    let q=i/64;

    let a=
      Math.PI/2-
      Math.PI*q;

    p.push({
      x:
        course.rx+
        course.r*
        Math.cos(a),

      y:
        course.cy+
        course.r*
        Math.sin(a)
    });
  }

  for(let i=1;i<=50;i++){
    let q=i/50;

    p.push({
      x:
        lp(
          course.rx,
          course.lx,
          q
        ),
      y:course.ty
    });
  }

  for(let i=1;i<=64;i++){
    let q=i/64;

    let a=
      -Math.PI/2-
      Math.PI*q;

    p.push({
      x:
        course.lx+
        course.r*
        Math.cos(a),

      y:
        course.cy+
        course.r*
        Math.sin(a)
    });
  }

  return p;
}

function courseDraw(){
  x.save();

  x.strokeStyle=
    "#effcff38";

  x.lineWidth=2;

  x.setLineDash(
    [7,12]
  );

  let draw=false;

  x.beginPath();

  for(const q of path()){
    let s=
      proj(
        q.x,
        q.y
      );

    if(!s||s.f<8){
      draw=false;
      continue;
    }

    if(!draw){
      x.moveTo(
        s.x,
        s.y
      );

      draw=true;
    }else{
      x.lineTo(
        s.x,
        s.y
      );
    }
  }

  x.stroke();

  x.restore();

  marks.forEach(mark);
}

function mark(m){
  let a=
    proj(
      m.x,
      m.y,
      0
    );

  let u=
    proj(
      m.x,
      m.y,
      66
    );

  if(
    !a||
    !u||
    a.f<10
  ){
    return;
  }

  let w=
    cl(
      34*a.sc,
      10,
      105
    );

  let hh=
    cl(
      a.y-u.y,
      24,
      190
    );

  let gx=
    x.createLinearGradient(
      a.x-w*.5,
      a.y-hh,
      a.x+w*.5,
      a.y
    );

  gx.addColorStop(
    0,
    "#fff47b"
  );

  gx.addColorStop(
    .45,
    "#ffd927"
  );

  gx.addColorStop(
    1,
    "#e69d00"
  );

  x.fillStyle=gx;

  x.beginPath();

  x.moveTo(
    a.x-w*.46,
    a.y
  );

  x.lineTo(
    a.x-w*.32,
    a.y-hh
  );

  x.lineTo(
    a.x+w*.32,
    a.y-hh
  );

  x.lineTo(
    a.x+w*.46,
    a.y
  );

  x.closePath();
  x.fill();

  x.strokeStyle="#fff";

  x.lineWidth=
    cl(
      w*.055,
      1.5,
      4
    );

  x.stroke();

  x.fillStyle="#e53232";

  x.fillRect(
    a.x-w*.38,
    a.y-hh*.43,
    w*.76,
    Math.max(
      3,
      hh*.10
    )
  );
}

function spray(){
  let sr=
    cl(
      Math.hypot(
        b.vx,
        b.vy
      )/250,
      0,
      1
    );

  if(sr<.08){
    return;
  }

  let cx=
    W*.5;

  let by=
    H*.91;

  x.save();

  x.globalCompositeOperation=
    "screen";

  for(const s of[-1,1]){
    x.beginPath();

    x.moveTo(
      cx+
      s*
      (36+sr*16),
      by
    );

    x.quadraticCurveTo(
      cx+
      s*
      (82+sr*45),
      H*.87,
      cx+
      s*
      (130+sr*110),
      H*.98
    );

    x.strokeStyle=
      `rgba(230,252,255,${.12+sr*.28})`;

    x.lineWidth=
      5+
      sr*7;

    x.stroke();
  }

  x.restore();
}

function cockpit(){
  let sr=
    cl(
      Math.hypot(
        b.vx,
        b.vy
      )/250,
      0,
      1
    );

  let rel=
    Math.atan2(
      Math.sin(
        b.a-cam.a
      ),
      Math.cos(
        b.a-cam.a
      )
    );

  let turn=
    cl(
      rel*.55,
      -.12,
      .12
    );

  x.save();

  x.translate(
    W*.5+
    cam.sx*.35,
    H*.925+
    cam.bob*.25
  );

  x.rotate(
    cam.roll*.46+
    turn
  );

  let s=
    cl(
      Math.min(
        W/1100,
        H/500
      ),
      .68,
      1.15
    );

  x.scale(
    s,
    s
  );

  x.fillStyle=
    "#182126";

  x.beginPath();

  x.moveTo(
    -235,
    80
  );

  x.lineTo(
    -118,
    -10
  );

  x.lineTo(
    -82,
    -118
  );

  x.lineTo(
    82,
    -118
  );

  x.lineTo(
    118,
    -10
  );

  x.lineTo(
    235,
    80
  );

  x.fill();

  let g=
    x.createLinearGradient(
      -180,
      -120,
      160,
      70
    );

  g.addColorStop(
    0,
    "#fff"
  );

  g.addColorStop(
    .55,
    "#e9eef0"
  );

  g.addColorStop(
    1,
    "#aebbc2"
  );

  x.fillStyle=g;

  x.beginPath();

  x.moveTo(
    0,
    -150
  );

  x.lineTo(
    -150,
    30
  );

  x.lineTo(
    -210,
    80
  );

  x.lineTo(
    210,
    80
  );

  x.lineTo(
    150,
    30
  );

  x.closePath();

  x.fill();

  x.fillStyle=
    "#d9233e";

  for(const side of[-1,1]){
    x.beginPath();

    x.moveTo(
      side*18,
      -142
    );

    x.lineTo(
      side*62,
      -18
    );

    x.lineTo(
      side*165,
      54
    );

    x.lineTo(
      side*90,
      54
    );

    x.lineTo(
      0,
      -82
    );

    x.fill();
  }

  x.fillStyle=
    "#252f34";

  x.beginPath();

  x.moveTo(
    -35,
    45
  );

  x.lineTo(
    -18,
    -42
  );

  x.lineTo(
    18,
    -42
  );

  x.lineTo(
    35,
    45
  );

  x.fill();

  x.strokeStyle=
    "#111b20";

  x.lineWidth=7;

  x.beginPath();

  x.arc(
    0,
    16,
    36,
    0,
    7
  );

  x.stroke();

  x.fillStyle=
    "#2b3236";

  x.beginPath();

  x.roundRect(
    82,
    -18,
    70,
    80,
    18
  );

  x.fill();

  x.restore();

  if(sr>.12){
    x.save();

    x.globalAlpha=
      .1+
      sr*.2;

    x.fillStyle="#fff";

    for(let i=0;i<18;i++){
      let px=
        W*.5+
        Math.sin(
          i*17.3
        )*
        W*.30;

      let py=
        H*.93+
        (
          (i*29)%
          Math.max(
            12,
            H*.06
          )
        );

      x.beginPath();

      x.arc(
        px,
        py,
        1.3+
        (i%4)*.8,
        0,
        7
      );

      x.fill();
    }

    x.restore();
  }
}

function render(){
  sky();
  shore();
  water();
  courseDraw();
  spray();
  cockpit();

  let v=
    x.createRadialGradient(
      W*.5,
      H*.48,
      Math.min(W,H)*.18,
      W*.5,
      H*.48,
      Math.max(W,H)*.68
    );

  v.addColorStop(
    .55,
    "#0000"
  );

  v.addColorStop(
    1,
    "#00121e2e"
  );

  x.fillStyle=v;

  x.fillRect(
    0,
    0,
    W,
    H
  );
}

function loop(n){
  let dt=
    Math.min(
      .035,
      (n-last)/1000
    );

  last=n;

  t+=dt;

  physics(dt);
  camera(dt);
  render();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
