<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BOAT RACER 操作テスト v2</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061522;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
#start{position:fixed;inset:0;z-index:50;background:linear-gradient(#58b4ed,#096e9c);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
#start h1{margin:0 0 8px;font-size:clamp(30px,7vw,65px)}
#start p{margin:0 0 24px}
#go{border:0;border-radius:16px;padding:18px 38px;background:#24e1ff;color:#04263a;font-size:24px;font-weight:900;touch-action:manipulation}
#ui{display:none;position:fixed;inset:0;color:#fff;text-shadow:0 2px 4px #000}
#top{position:absolute;top:2%;left:50%;transform:translateX(-50%);padding:7px 16px;background:#071a2dcc;border-bottom:4px solid #2ce5ff;font-weight:900;font-size:clamp(17px,2.6vw,28px)}
#speed{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);font-size:clamp(28px,5vw,54px);font-weight:900}
#status{position:absolute;left:2%;top:2%;background:#071a2dcc;padding:8px 12px;border-radius:8px;font-weight:800}
#hint{position:absolute;right:2%;top:2%;background:#071a2dcc;padding:8px 12px;border-radius:8px;font-size:13px}
#throttleArea{position:absolute;left:2%;top:20%;width:18%;height:60%}
#tTrack{position:absolute;left:50%;top:0;bottom:0;width:25px;transform:translateX(-50%);border:2px solid #d9f9ff;border-radius:15px;background:#061c31aa}
#tKnob{position:absolute;left:50%;bottom:0;width:72px;height:44px;transform:translate(-50%,50%);border:4px solid #666;border-radius:10px;background:#eee}
.lab{position:absolute;color:#fff;font-weight:900}
#tl{top:-29px;left:50%;transform:translateX(-50%)}
#steerArea{position:absolute;right:2%;bottom:5%;width:37%;height:31%}
#sTrack{position:absolute;left:0;right:0;top:58%;height:26px;border:2px solid #d9f9ff;border-radius:15px;background:#061c31aa}
#sKnob{position:absolute;left:50%;top:58%;width:65px;height:65px;transform:translate(-50%,-50%);border-radius:50%;border:6px solid #555;background:#eee}
#sl{left:50%;top:16%;transform:translateX(-50%)}
#angle{position:absolute;right:3%;bottom:37%;font-weight:800}
#rotate{display:none;position:fixed;inset:0;z-index:100;background:#061522;color:#fff;align-items:center;justify-content:center;text-align:center;font-size:22px;padding:30px}
@media(orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="start">
<h1>🚤 BOAT RACER</h1>
<p>旋回テスト v2</p>
<button id="go">レース開始</button>
</div>

<div id="ui">
<div id="top">操作テスト</div>
<div id="status">機力 B　旋回力 9</div>
<div id="hint">左：加減速　右：操舵</div>
<div id="speed">0.0 km/h</div>
<div id="angle">進行方向 0°</div>

<div id="throttleArea">
<span class="lab" id="tl">アクセル</span>
<div id="tTrack"></div>
<div id="tKnob"></div>
</div>

<div id="steerArea">
<span class="lab" id="sl">ハンドル</span>
<div id="sTrack"></div>
<div id="sKnob"></div>
</div>
</div>

<div id="rotate">📱 横向きにしてプレイ</div>

<script>
"use strict";

const $=id=>document.getElementById(id);
const c=$("c");
const g=c.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let D=1;

function resize(){
 W=innerWidth;
 H=innerHeight;
 D=Math.min(devicePixelRatio||1,2);
 c.width=W*D;
 c.height=H*D;
 g.setTransform(D,0,0,D,0,0);
}

addEventListener("resize",resize);
resize();

let playing=false;
let throttle=0;
let steer=0;
let speed=0;
let heading=0;
let wx=0;
let wy=0;
let last=performance.now();

$("go").onclick=()=>{
 $("start").style.display="none";
 $("ui").style.display="block";
 playing=true;
};

function clamp(v,a,b){
 return Math.max(a,Math.min(b,v));
}

function setThrottle(y){
 const r=$("throttleArea").getBoundingClientRect();
 throttle=clamp(1-(y-r.top)/r.height,0,1);
 $("tKnob").style.bottom=(throttle*100)+"%";
}

function setSteer(x){
 const r=$("steerArea").getBoundingClientRect();
 steer=clamp(((x-r.left)/r.width-.5)*2,-1,1);
 $("sKnob").style.left=(50+steer*45)+"%";
}

$("throttleArea").onpointerdown=e=>{
 e.currentTarget.setPointerCapture(e.pointerId);
 setThrottle(e.clientY);
};

$("throttleArea").onpointermove=e=>{
 if(e.buttons||e.pointerType==="touch")setThrottle(e.clientY);
};

$("steerArea").onpointerdown=e=>{
 e.currentTarget.setPointerCapture(e.pointerId);
 setSteer(e.clientX);
};

$("steerArea").onpointermove=e=>{
 if(e.buttons||e.pointerType==="touch")setSteer(e.clientX);
};

$("steerArea").onpointerup=()=>{
 steer=0;
 $("sKnob").style.left="50%";
};

$("steerArea").onpointercancel=$("steerArea").onpointerup;

function project(worldX,worldY){
 let dx=worldX-wx;
 let dy=worldY-wy;

 let cs=Math.cos(-heading);
 let sn=Math.sin(-heading);

 let rx=dx*cs-dy*sn;
 let ry=dx*sn+dy*cs;

 return{x:rx,y:ry};
}

function worldToScreen(P){
 if(P.y<5)return null;

 let horizon=H*.39;
 let focal=W*.72;

 let sx=W/2+(P.x/P.y)*focal;
 let sy=horizon+(1/P.y)*focal*55;

 return{
  x:sx,
  y:sy,
  scale:clamp(75/P.y,.03,2.5)
 };
}

function drawSkyWater(){
 const h=H*.39;

 let sky=g.createLinearGradient(0,0,0,h);
 sky.addColorStop(0,"#58b2eb");
 sky.addColorStop(1,"#dff6ff");

 g.fillStyle=sky;
 g.fillRect(0,0,W,h);

 let sea=g.createLinearGradient(0,h,0,H);
 sea.addColorStop(0,"#3297c3");
 sea.addColorStop(1,"#07577d");

 g.fillStyle=sea;
 g.fillRect(0,h,W,H-h);

 g.fillStyle="#4f7178";
 g.fillRect(0,h-8,W,9);

 for(let i=0;i<26;i++){
  let yy=h+((i*49+(Math.abs(wx)+Math.abs(wy))*2.5)%(H-h));
  let p=(yy-h)/(H-h);
  let shift=Math.sin(heading)*p*W*.45;

  g.strokeStyle=`rgba(225,250,255,${.07+p*.24})`;
  g.lineWidth=1+p*2;

  g.beginPath();
  g.moveTo(W/2+shift-25-p*150,yy);
  g.lineTo(W/2+shift+25+p*150,yy);
  g.stroke();
 }
}

function drawMarkers(){
 const objs=[
  {x:-120,y:650,c:"#ffd31c"},
  {x:120,y:650,c:"#e33a36"},
  {x:120,y:-650,c:"#ffd31c"},
  {x:-120,y:-650,c:"#e33a36"}
 ];

 for(const o of objs){
  const P=project(o.x,o.y);
  const S=worldToScreen(P);

  if(!S)continue;

  const r=clamp(12*S.scale,3,38);

  g.fillStyle=o.c;
  g.beginPath();
  g.ellipse(S.x,S.y,r*.65,r*1.5,0,0,Math.PI*2);
  g.fill();
 }
}

function drawBoat(){
 g.save();

 g.translate(W/2+steer*22,H*.87);
 g.rotate(-steer*.035);

 g.fillStyle="#d51e35";
 g.beginPath();
 g.moveTo(-W*.19,35);
 g.lineTo(-70,-40);
 g.lineTo(0,-72);
 g.lineTo(70,-40);
 g.lineTo(W*.19,35);
 g.closePath();
 g.fill();

 g.fillStyle="#f2f2f2";
 g.beginPath();
 g.moveTo(-52,-39);
 g.lineTo(0,-67);
 g.lineTo(52,-39);
 g.lineTo(28,-25);
 g.lineTo(-28,-25);
 g.closePath();
 g.fill();

 g.save();
 g.translate(0,1);
 g.rotate(steer*1.2);

 g.strokeStyle="#222";
 g.lineWidth=8;

 g.beginPath();
 g.arc(0,0,43,0,Math.PI*2);
 g.stroke();

 g.lineWidth=5;

 for(let a=0;a<Math.PI*2;a+=Math.PI/3){
  g.beginPath();
  g.moveTo(0,0);
  g.lineTo(Math.cos(a)*38,Math.sin(a)*38);
  g.stroke();
 }

 g.restore();
 g.restore();
}

function update(dt){
 if(!playing)return;

 const maxKmh=82;
 const maxGame=maxKmh/1.65;

 let target=maxGame*throttle;

 speed+=(target-speed)*dt*(target>speed?1.25:2.2);

 speed-=Math.abs(steer)*speed*.10*dt;
 speed=clamp(speed,0,maxGame);

 let turnRate=steer*(0.22+speed/maxGame*0.95);

 heading+=turnRate*dt;

 wx+=Math.sin(heading)*speed*dt*2.0;
 wy+=Math.cos(heading)*speed*dt*2.0;

 $("speed").textContent=(speed*1.65).toFixed(1)+" km/h";

 let deg=((heading*180/Math.PI)%360+360)%360;

 $("angle").textContent="進行方向 "+deg.toFixed(0)+"°";
}

function frame(now){
 let dt=Math.min((now-last)/1000,.04);
 last=now;

 update(dt);
 drawSkyWater();
 drawMarkers();
 drawBoat();

 requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
