<!doctype html>
<html lang="ja">
<head>す
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>BOAT RACER 旋回テスト v5</title>

<style>
*{
 box-sizing:border-box;
 -webkit-user-select:none;
 user-select:none;
 touch-action:none;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#087fa8;
 font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

canvas{
 position:fixed;
 inset:0;
 width:100%;
 height:100%;
}

#start{
 position:fixed;
 inset:0;
 z-index:30;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 background:linear-gradient(#54c5ed,#087fa8);
 color:white;
}

#start h1{
 margin:0 0 8px;
 font-size:clamp(30px,7vw,60px);
}

#start p{
 text-align:center;
 line-height:1.6;
 margin:0 20px 20px;
}

button{
 border:0;
 border-radius:14px;
 font-weight:900;
}

#go{
 padding:16px 32px;
 font-size:22px;
 background:white;
 color:#075d7c;
}

#ui{
 display:none;
 position:fixed;
 inset:0;
 color:white;
 text-shadow:0 2px 4px #003;
}

#title{
 position:absolute;
 top:2%;
 left:50%;
 transform:translateX(-50%);
 background:#06283dcc;
 padding:6px 14px;
 border-radius:9px;
 font-weight:900;
}

#speed{
 position:absolute;
 bottom:2%;
 left:50%;
 transform:translateX(-50%);
 font-size:clamp(23px,4vw,42px);
 font-weight:900;
}

#reset{
 position:absolute;
 right:2%;
 top:2%;
 padding:8px 12px;
 background:#ffffffdd;
 color:#064b65;
}

#throttle{
 position:absolute;
 left:1.5%;
 top:25%;
 width:15%;
 height:52%;
}

#tt{
 position:absolute;
 left:50%;
 top:0;
 bottom:0;
 width:23px;
 transform:translateX(-50%);
 border:2px solid white;
 border-radius:14px;
 background:#04283a88;
}

#tk{
 position:absolute;
 left:50%;
 bottom:0;
 width:66px;
 height:42px;
 transform:translate(-50%,50%);
 background:#eee;
 border:4px solid #555;
 border-radius:9px;
}

#steer{
 position:absolute;
 right:1.5%;
 bottom:4%;
 width:34%;
 height:27%;
}

#st{
 position:absolute;
 left:0;
 right:0;
 top:58%;
 height:24px;
 border:2px solid white;
 border-radius:14px;
 background:#04283a88;
}

#sk{
 position:absolute;
 left:50%;
 top:58%;
 width:62px;
 height:62px;
 transform:translate(-50%,-50%);
 background:#eee;
 border:6px solid #555;
 border-radius:50%;
}

.label{
 position:absolute;
 font-weight:900;
}

#la{
 top:-29px;
 left:50%;
 transform:translateX(-50%);
}

#lh{
 top:12%;
 left:50%;
 transform:translateX(-50%);
}

#rotate{
 display:none;
 position:fixed;
 z-index:99;
 inset:0;
 background:#071b29;
 color:white;
 align-items:center;
 justify-content:center;
 text-align:center;
 font-size:22px;
}

@media(orientation:portrait){
 #rotate{
  display:flex;
 }
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="start">
 <h1>🚤 BOAT RACER</h1>

 <p>
  旋回テスト v5<br>
  ターンマークと平行に直進 → 外側を旋回
 </p>

 <button id="go">
  テスト開始
 </button>
</div>


<div id="ui">

 <div id="title">
  v5 直進＋ターン物理
 </div>

 <div id="speed">
  0.0 km/h
 </div>

 <button id="reset">
  位置リセット
 </button>


 <div id="throttle">

  <span
   class="label"
   id="la">
   アクセル
  </span>

  <div id="tt"></div>

  <div id="tk"></div>

 </div>


 <div id="steer">

  <span
   class="label"
   id="lh">
   ハンドル
  </span>

  <div id="st"></div>

  <div id="sk"></div>

 </div>

</div>


<div id="rotate">
 📱 iPhoneを横向きにしてプレイ
</div>


<script>

"use strict";


const $ =
id =>
document.getElementById(id);


const c =
$("c");


const g =
c.getContext("2d");


const clamp =
(v,a,b) =>
Math.max(
 a,
 Math.min(
  b,
  v
 )
);


let W =
innerWidth;


let H =
innerHeight;


let D =
1;


let playing =
false;


let last =
performance.now();


let throttle =
0;


let steer =
0;


let engineSpeed =
0;


let boat = {

 x:0,

 y:0,

 a:0,

 vx:0,

 vy:0,

 yaw:0

};



/* ==========================
   画面サイズ
========================== */

function resize(){

 W =
 innerWidth;


 H =
 innerHeight;


 D =
 Math.min(
  devicePixelRatio || 1,
  2
 );


 c.width =
 W * D;


 c.height =
 H * D;


 g.setTransform(
  D,
  0,
  0,
  D,
  0,
  0
 );


 resetBoat();

}



/* ==========================
   スタート位置
========================== */

function resetBoat(){

 /*
  ターンマーク2個と
  平行な位置からスタート。

  艇首は右向き。

       ●       ●

  🚤 → → → → →
 */

 boat.x =
 W * .20;


 boat.y =
 H * .76;


 boat.a =
 0;


 boat.vx =
 0;


 boat.vy =
 0;


 boat.yaw =
 0;


 engineSpeed =
 0;

}


addEventListener(
 "resize",
 resize
);


resize();



$("go").onclick =
()=>{

 $("start").style.display =
 "none";


 $("ui").style.display =
 "block";


 playing =
 true;


 resetBoat();

};



$("reset").onclick =
resetBoat;



/* ==========================
   アクセル操作
========================== */

function setThrottle(y){

 const r =
 $("throttle")
 .getBoundingClientRect();


 throttle =
 clamp(
  1 -
  (y-r.top) /
  r.height,
  0,
  1
 );


 $("tk").style.bottom =
 (throttle*100)
 +"%";

}



function setSteer(x){

 const r =
 $("steer")
 .getBoundingClientRect();


 steer =
 clamp(
  (
   (x-r.left) /
   r.width
   -.5
  )*2,
  -1,
  1
 );


 $("sk").style.left =
 (50+steer*45)
 +"%";

}



$("throttle").onpointerdown =
e=>{

 e.currentTarget
 .setPointerCapture(
  e.pointerId
 );


 setThrottle(
  e.clientY
 );

};



$("throttle").onpointermove =
e=>{

 if(
  e.buttons ||
  e.pointerType==="touch"
 ){

  setThrottle(
   e.clientY
  );

 }

};



$("steer").onpointerdown =
e=>{

 e.currentTarget
 .setPointerCapture(
  e.pointerId
 );


 setSteer(
  e.clientX
 );

};



$("steer").onpointermove =
e=>{

 if(
  e.buttons ||
  e.pointerType==="touch"
 ){

  setSteer(
   e.clientX
  );

 }

};



function centerSteer(){

 steer =
 0;


 $("sk").style.left =
 "50%";

}


$("steer").onpointerup =
centerSteer;


$("steer").onpointercancel =
centerSteer;



/* ==========================
   v5 ボート物理
========================== */

function physics(dt){

 if(!playing)
 return;


 /*
  最大速度

  表示上は約82km/h
 */

 const MAX =
 245;



 /*
  アクセルに応じた
  目標速度
 */

 const target =
 MAX *
 throttle;



 /*
  加速と減速

  加速は少しゆっくり
 */

 const accel =
 target>engineSpeed
 ?0.78
 :2.0;


 engineSpeed +=
 (
  target -
  engineSpeed
 )
 *
 Math.min(
  1,
  accel*dt
 );



 const speedRatio =
 clamp(
  engineSpeed/MAX,
  0,
  1
 );


 const absSteer =
 Math.abs(
  steer
 );



 /*
  ハンドルを切ったときの
  旋回力

  一瞬でクルッと
  曲がらないようにする
 */

 const turnAuthority =
 (
  0.48 +
  0.68*speedRatio
 );



 const targetYaw =
 steer *
 turnAuthority;



 /*
  艇首がじわっと
  回り始める
 */

 const yawResponse =
 steer===0
 ?2.5
 :2.05;



 boat.yaw +=
 (
  targetYaw -
  boat.yaw
 )
 *
 Math.min(
  1,
  yawResponse*dt
 );



 /*
  実際に艇首を回す
 */

 boat.a +=
 boat.yaw *
 dt;



 /*
  旋回中は
  少し速度が落ちる
 */

 const turnLoss =
 1 -
 (
  0.22 *
  absSteer *
  speedRatio
 );



 const propulsion =
 engineSpeed *
 turnLoss;



 /*
  艇首が向いている方向
 */

 const hx =
 Math.cos(
  boat.a
 );


 const hy =
 Math.sin(
  boat.a
 );



 const wantVX =
 hx *
 propulsion;


 const wantVY =
 hy *
 propulsion;



 /*
  ★重要

  高速でハンドルを
  大きく切るほど
  艇が外側へ流れる。

  艇首だけ先に回って、
  実際の進行方向は
  少し遅れてついてくる。
 */

 const slip =
 absSteer *
 speedRatio;



 const follow =
 3.15 -
 (
  1.95 *
  slip
 );



 boat.vx +=
 (
  wantVX -
  boat.vx
 )
 *
 Math.min(
  1,
  follow*dt
 );



 boat.vy +=
 (
  wantVY -
  boat.vy
 )
 *
 Math.min(
  1,
  follow*dt
 );



 /*
  水の抵抗
 */

 const waterDrag =
 Math.max(
  0,
  1 -
  (
   0.055 +
   0.17*slip
  )*dt
 );



 boat.vx *=
 waterDrag;


 boat.vy *=
 waterDrag;



 /*
  実際に移動
 */

 boat.x +=
 boat.vx *
 dt;


 boat.y +=
 boat.vy *
 dt;



 /*
  テスト中に
  画面外へ消えないようにする
 */

 const m =
 24;


 if(
  boat.x<m
 ){

  boat.x =
  m;


  boat.vx =
  Math.max(
   0,
   boat.vx
  )*.2;

 }


 if(
  boat.x>W-m
 ){

  boat.x =
  W-m;


  boat.vx =
  Math.min(
   0,
   boat.vx
  )*.2;

 }


 if(
  boat.y<m
 ){

  boat.y =
  m;


  boat.vy =
  Math.max(
   0,
   boat.vy
  )*.2;

 }


 if(
  boat.y>H-m
 ){

  boat.y =
  H-m;


  boat.vy =
  Math.min(
   0,
   boat.vy
  )*.2;

 }



 /*
  実際の移動速度
 */

 const actual =
 Math.hypot(
  boat.vx,
  boat.vy
 );



 /*
  km/h表示
 */

 $("speed").textContent =
 (
  actual /
  MAX *
  82
 )
 .toFixed(1)
 +" km/h";

}



/* ==========================
   固定された水面
========================== */

function drawWater(){

 const gr =
 g.createLinearGradient(
  0,
  0,
  0,
  H
 );


 gr.addColorStop(
  0,
  "#20a8cf"
 );


 gr.addColorStop(
  1,
  "#08779f"
 );


 g.fillStyle =
 gr;


 g.fillRect(
  0,
  0,
  W,
  H
 );



 /*
  水面模様

  カメラが動いていないことを
  分かりやすくする
 */

 g.strokeStyle =
 "rgba(255,255,255,.11)";


 g.lineWidth =
 1;



 for(
  let y=24;
  y<H;
  y+=32
 ){

  g.beginPath();


  for(
   let x=0;
   x<=W;
   x+=45
  ){

   const yy =
   y +
   Math.sin(
    x*.035 +
    y*.025
   )*3.5;


   if(x===0){

    g.moveTo(
     x,
     yy
    );

   }else{

    g.lineTo(
     x,
     yy
    );

   }

  }


  g.stroke();

 }



 /*
  コースの目安

  2つのターンマークの
  外側を時計回り
 */

 const cx =
 W*.5;


 const cy =
 H*.50;


 const rx =
 W*.37;


 const ry =
 H*.31;


 g.setLineDash(
  [10,13]
 );


 g.strokeStyle =
 "rgba(255,255,255,.22)";


 g.lineWidth =
 3;


 g.beginPath();


 g.ellipse(
  cx,
  cy,
  rx,
  ry,
  0,
  0,
  Math.PI*2
 );


 g.stroke();


 g.setLineDash(
  []
 );



 /*
  下側

  左 → 右
 */

 g.fillStyle =
 "rgba(255,255,255,.55)";


 g.font =
 "bold 24px sans-serif";


 g.fillText(
  "→   →   →   →",
  W*.35,
  H*.84
 );



 /*
  上側

  右 → 左
 */

 g.fillText(
  "←   ←   ←   ←",
  W*.35,
  H*.18
 );

}



/* ==========================
   ターンマーク
========================== */

function mark(x,y){

 g.save();


 g.translate(
  x,
  y
 );


 /*
  影
 */

 g.fillStyle =
 "rgba(0,0,0,.2)";


 g.beginPath();


 g.ellipse(
  5,
  14,
  19,
  8,
  0,
  0,
  Math.PI*2
 );


 g.fill();



 /*
  黄色部分
 */

 g.fillStyle =
 "#ffd21c";


 g.beginPath();


 g.moveTo(
  -12,
  19
 );


 g.lineTo(
  -8,
  -19
 );


 g.lineTo(
  8,
  -19
 );


 g.lineTo(
  12,
  19
 );


 g.closePath();


 g.fill();



 /*
  赤ライン
 */

 g.fillStyle =
 "#e43a36";


 g.fillRect(
  -9,
  -4,
  18,
  9
 );


 g.strokeStyle =
 "white";


 g.lineWidth =
 2;


 g.strokeRect(
  -9,
  -4,
  18,
  9
 );


 g.restore();

}



/* ==========================
   引き波
========================== */

function wake(){

 const v =
 Math.hypot(
  boat.vx,
  boat.vy
 );


 const s =
 clamp(
  v/245,
  0,
  1
 );


 if(s<.05)
 return;



 /*
  艇首方向ではなく

  実際に進んでいる方向から
  引き波を出す。

  これで横滑りが見える。
 */

 const va =
 Math.atan2(
  boat.vy,
  boat.vx
 );


 const back =
 va +
 Math.PI;



 const bx =
 boat.x +
 Math.cos(
  back
 )*17;


 const by =
 boat.y +
 Math.sin(
  back
 )*17;



 const nx =
 Math.cos(
  va +
  Math.PI/2
 );


 const ny =
 Math.sin(
  va +
  Math.PI/2
 );



 const len =
 28 +
 72*s;



 g.strokeStyle =
 `rgba(255,255,255,${.24+.46*s})`;


 g.lineWidth =
 3;



 for(
  const side
  of [-1,1]
 ){

  g.beginPath();


  g.moveTo(
   bx +
   nx*7*side,

   by +
   ny*7*side
  );


  g.lineTo(

   bx +
   Math.cos(back)*len +
   nx*20*side,

   by +
   Math.sin(back)*len +
   ny*20*side

  );


  g.stroke();

 }

}



/* ==========================
   ボート
========================== */

function drawBoat(){

 g.save();


 g.translate(
  boat.x,
  boat.y
 );


 g.rotate(
  boat.a
 );



 /*
  赤い船体
 */

 g.fillStyle =
 "#d91f38";


 g.beginPath();


 g.moveTo(
  24,
  0
 );


 g.lineTo(
  -14,
  -11
 );


 g.lineTo(
  -21,
  0
 );


 g.lineTo(
  -14,
  11
 );


 g.closePath();


 g.fill();



 /*
  白い艇首
 */

 g.fillStyle =
 "white";


 g.beginPath();


 g.moveTo(
  16,
  0
 );


 g.lineTo(
  -6,
  -6
 );


 g.lineTo(
  -6,
  6
 );


 g.closePath();


 g.fill();



 /*
  操縦席
 */

 g.fillStyle =
 "#222";


 g.beginPath();


 g.arc(
  -5,
  0,
  3.5,
  0,
  Math.PI*2
 );


 g.fill();


 g.restore();

}



/* ==========================
   メインループ
========================== */

function frame(t){

 const dt =
 Math.min(
  .035,
  (t-last)/1000
 );


 last =
 t;



 physics(
  dt
 );


 drawWater();



 /*
  左ターンマーク
 */

 mark(
  W*.32,
  H*.50
 );



 /*
  右ターンマーク
 */

 mark(
  W*.68,
  H*.50
 );



 wake();


 drawBoat();



 requestAnimationFrame(
  frame
 );

}


requestAnimationFrame(
 frame
);

</script>

</body>
</html>
