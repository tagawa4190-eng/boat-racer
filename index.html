<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
 name="viewport"
 content="width=device-width,
 initial-scale=1,
 maximum-scale=1,
 user-scalable=no,
 viewport-fit=cover"
>

<title>BOAT RACER v7.1</title>

<style>

*{
 box-sizing:border-box;
 user-select:none;
 -webkit-user-select:none;
 touch-action:none;
}

html,
body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#087da5;
 font-family:
 -apple-system,
 BlinkMacSystemFont,
 sans-serif;
}

canvas{
 position:fixed;
 inset:0;
 width:100%;
 height:100%;
}


/* =====================
   START
===================== */

#start{
 position:fixed;
 inset:0;
 z-index:20;

 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;

 color:white;

 background:
 linear-gradient(
  #36b8df,
  #087da5
 );
}

#start h1{
 margin:0 0 10px;
 font-size:42px;
}

#start h2{
 margin:0 0 25px;
}

#start button{
 border:0;
 border-radius:15px;

 padding:16px 30px;

 font-size:22px;
 font-weight:bold;

 background:white;
 color:#075a78;
}


/* =====================
   HUD
===================== */

#ui{
 display:none;

 position:fixed;
 inset:0;

 color:white;

 pointer-events:none;
}

#version{

 position:absolute;

 top:10px;
 left:50%;

 transform:
 translateX(-50%);

 padding:
 7px 15px;

 border-radius:
 10px;

 background:
 rgba(0,30,50,.75);

 font-weight:bold;
}

#speed{

 position:absolute;

 top:10px;
 left:15px;

 padding:
 7px 12px;

 border-radius:
 10px;

 background:
 rgba(0,30,50,.75);

 font-weight:bold;
}

#reset{

 position:absolute;

 top:10px;
 right:15px;

 pointer-events:auto;

 border:0;

 border-radius:
 10px;

 padding:
 9px 13px;

 font-weight:bold;
}


/* =====================
   ACCEL
===================== */

#throttle{

 position:absolute;

 left:15px;
 top:25%;

 width:110px;
 height:55%;

 pointer-events:auto;
}

#throttleText{

 position:absolute;

 width:100%;

 text-align:center;

 top:-30px;

 font-weight:bold;
}

#throttleTrack{

 position:absolute;

 left:50%;
 top:0;

 width:24px;
 height:100%;

 transform:
 translateX(-50%);

 border:
 2px solid white;

 border-radius:
 15px;

 background:
 rgba(0,20,40,.45);
}

#throttleKnob{

 position:absolute;

 left:50%;
 bottom:0;

 width:70px;
 height:42px;

 transform:
 translate(-50%,50%);

 border:
 4px solid #555;

 border-radius:
 10px;

 background:white;
}


/* =====================
   STEERING
===================== */

#steering{

 position:absolute;

 right:15px;
 bottom:15px;

 width:310px;
 height:135px;

 pointer-events:auto;
}

#steeringText{

 position:absolute;

 top:0;

 width:100%;

 text-align:center;

 font-weight:bold;
}

#steeringTrack{

 position:absolute;

 left:0;
 right:0;

 top:75px;

 height:24px;

 border:
 2px solid white;

 border-radius:
 15px;

 background:
 rgba(0,20,40,.45);
}

#steeringKnob{

 position:absolute;

 left:50%;
 top:87px;

 width:65px;
 height:65px;

 transform:
 translate(-50%,-50%);

 border:
 6px solid #555;

 border-radius:
 50%;

 background:white;
}


/* =====================
   PORTRAIT
===================== */

#portrait{

 display:none;

 position:fixed;

 inset:0;

 z-index:100;

 align-items:center;
 justify-content:center;

 text-align:center;

 color:white;

 background:#061d2c;

 font-size:22px;
}

@media
(orientation:portrait){

 #portrait{
  display:flex;
 }

}

</style>
</head>


<body>


<canvas id="game"></canvas>


<div id="start">

 <h1>
  🚤 BOAT RACER
 </h1>

 <h2>
  操作テスト v7.1
 </h2>

 <button id="startButton">
  スタート
 </button>

</div>



<div id="ui">

 <div id="speed">
  0.0 km/h
 </div>

 <div id="version">
  操作テスト v7.1
 </div>

 <button id="reset">
  リセット
 </button>


 <!-- ACCEL -->

 <div id="throttle">

  <div id="throttleText">
   アクセル
  </div>

  <div id="throttleTrack">
  </div>

  <div id="throttleKnob">
  </div>

 </div>



 <!-- STEERING -->

 <div id="steering">

  <div id="steeringText">
   ← 左　ハンドル　右 →
  </div>

  <div id="steeringTrack">
  </div>

  <div id="steeringKnob">
  </div>

 </div>

</div>



<div id="portrait">

 📱 横向きにしてプレイ

</div>



<script>

/* ============================
   BASIC
============================ */

const canvas =
document.getElementById(
 "game"
);


const ctx =
canvas.getContext(
 "2d"
);


const clamp =
(v,min,max) =>
Math.max(
 min,
 Math.min(
  max,
  v
 )
);


let W;
let H;
let DPR;


let running =
false;


let throttle =
0;


let steering =
0;


let previous =
performance.now();



/* ============================
   BOAT
============================ */

const boat = {

 x:0,

 y:0,

 angle:0,

 vx:0,

 vy:0,

 yaw:0,

 engine:0

};



/* ============================
   RESIZE
============================ */

function resize(){

 W =
 innerWidth;


 H =
 innerHeight;


 DPR =
 Math.min(
  devicePixelRatio || 1,
  2
 );


 canvas.width =
 W * DPR;


 canvas.height =
 H * DPR;


 ctx.setTransform(
  DPR,
  0,
  0,
  DPR,
  0,
  0
 );


 resetBoat();

}


window.addEventListener(
 "resize",
 resize
);



/* ============================
   RESET
============================ */

function resetBoat(){

 boat.x =
 W * 0.18;


 boat.y =
 H * 0.76;


 /*
  0 = 右向き
 */

 boat.angle =
 0;


 boat.vx =
 0;


 boat.vy =
 0;


 boat.yaw =
 0;


 boat.engine =
 0;


 throttle =
 0;


 steering =
 0;


 document
 .getElementById(
  "throttleKnob"
 )
 .style.bottom =
 "0%";


 document
 .getElementById(
  "steeringKnob"
 )
 .style.left =
 "50%";

}



resize();



/* ============================
   START
============================ */

document
.getElementById(
 "startButton"
)
.onclick =
()=>{

 document
 .getElementById(
  "start"
 )
 .style.display =
 "none";


 document
 .getElementById(
  "ui"
 )
 .style.display =
 "block";


 running =
 true;


 resetBoat();

};



document
.getElementById(
 "reset"
)
.onclick =
resetBoat;



/* ============================
   THROTTLE
============================ */

const throttleArea =
document.getElementById(
 "throttle"
);


const throttleKnob =
document.getElementById(
 "throttleKnob"
);


function updateThrottle(y){

 const rect =
 throttleArea
 .getBoundingClientRect();


 throttle =
 clamp(

  1 -
  (
   y -
   rect.top
  )
  /
  rect.height,

  0,

  1

 );


 throttleKnob
 .style.bottom =

 (throttle * 100)
 +
 "%";

}



throttleArea
.addEventListener(
 "pointerdown",
 e=>{

  throttleArea
  .setPointerCapture(
   e.pointerId
  );


  updateThrottle(
   e.clientY
  );

 }
);



throttleArea
.addEventListener(
 "pointermove",
 e=>{

  if(
   e.buttons ||
   e.pointerType ===
   "touch"
  ){

   updateThrottle(
    e.clientY
   );

  }

 }
);



/* ============================
   STEERING
============================ */

const steeringArea =
document.getElementById(
 "steering"
);


const steeringKnob =
document.getElementById(
 "steeringKnob"
);


function updateSteering(x){

 const rect =
 steeringArea
 .getBoundingClientRect();


 steering =
 clamp(

  (
   (
    x -
    rect.left
   )
   /
   rect.width
   -
   0.5
  )
  *
  2,

  -1,

  1

 );


 steeringKnob
 .style.left =

 (
  50 +
  steering * 45
 )
 +
 "%";

}



steeringArea
.addEventListener(
 "pointerdown",
 e=>{

  steeringArea
  .setPointerCapture(
   e.pointerId
  );


  updateSteering(
   e.clientX
  );

 }
);



steeringArea
.addEventListener(
 "pointermove",
 e=>{

  if(
   e.buttons ||
   e.pointerType ===
   "touch"
  ){

   updateSteering(
    e.clientX
   );

  }

 }
);



function releaseSteering(){

 steering =
 0;


 steeringKnob
 .style.left =
 "50%";

}



steeringArea
.addEventListener(
 "pointerup",
 releaseSteering
);


steeringArea
.addEventListener(
 "pointercancel",
 releaseSteering
);



/* ============================
   PHYSICS
============================ */

function physics(dt){

 if(!running){
  return;
 }


 const MAX_SPEED =
 250;


 /*
  ACCELERATION
 */

 const targetEngine =
 throttle *
 MAX_SPEED;


 const response =
 targetEngine >
 boat.engine
 ?
 1.05
 :
 2.3;


 boat.engine +=
 (
  targetEngine -
  boat.engine
 )
 *
 Math.min(
  1,
  response * dt
 );



 const speedRatio =
 clamp(
  boat.engine /
  MAX_SPEED,
  0,
  1
 );



 /*
  =========================
  TURN
  =========================

  LEFT  = negative

  RIGHT = positive
 */


 const targetYaw =

 steering *

 (
  0.35 +
  speedRatio *
  0.90
 );



 boat.yaw +=

 (
  targetYaw -
  boat.yaw
 )

 *

 Math.min(
  1,
  2.2 * dt
 );



 /*
  ハンドルを戻した時
  旋回を自然に収める
 */

 if(
  Math.abs(
   steering
  )
  <
  0.02
 ){

  boat.yaw *=
  Math.pow(
   0.25,
   dt
  );

 }



 boat.angle +=
 boat.yaw *
 dt;



 /*
  =========================
  TURN SPEED LOSS
  =========================
 */

 const steeringAmount =
 Math.abs(
  steering
 );


 const turnLoss =

 1 -

 (
  steeringAmount *
  speedRatio *
  0.24
 );



 const forwardSpeed =

 boat.engine *

 turnLoss;



 /*
  BOAT DIRECTION
 */

 const directionX =
 Math.cos(
  boat.angle
 );


 const directionY =
 Math.sin(
  boat.angle
 );



 const targetVX =
 directionX *
 forwardSpeed;


 const targetVY =
 directionY *
 forwardSpeed;



 /*
  =========================
  SLIDE / DRIFT
  =========================

  高速でハンドルを
  大きく切るほど

  艇首だけ先に向き、

  実際の進行方向は
  少し遅れてついてくる
 */

 const slip =

 steeringAmount *

 speedRatio;



 const grip =

 3.7 -

 slip *
 2.45;



 boat.vx +=

 (
  targetVX -
  boat.vx
 )

 *

 Math.min(
  1,
  grip * dt
 );



 boat.vy +=

 (
  targetVY -
  boat.vy
 )

 *

 Math.min(
  1,
  grip * dt
 );



 /*
  WATER RESISTANCE
 */

 const resistance =

 Math.max(

  0,

  1 -

  (
   0.04 +
   slip * 0.11
  )
  *
  dt

 );


 boat.vx *=
 resistance;


 boat.vy *=
 resistance;



 /*
  MOVE
 */

 boat.x +=
 boat.vx *
 dt;


 boat.y +=
 boat.vy *
 dt;



 /*
  SCREEN BOUNDARY
 */

 const margin =
 25;


 if(
  boat.x <
  margin
 ){

  boat.x =
  margin;

  boat.vx =
  0;

 }


 if(
  boat.x >
  W -
  margin
 ){

  boat.x =
  W -
  margin;

  boat.vx =
  0;

 }


 if(
  boat.y <
  margin
 ){

  boat.y =
  margin;

  boat.vy =
  0;

 }


 if(
  boat.y >
  H -
  margin
 ){

  boat.y =
  H -
  margin;

  boat.vy =
  0;

 }



 /*
  SPEED DISPLAY
 */

 const speed =

 Math.hypot(
  boat.vx,
  boat.vy
 );


 document
 .getElementById(
  "speed"
 )
 .textContent =

 (
  speed /
  MAX_SPEED *
  82
 )
 .toFixed(1)

 +

 " km/h";

}



/* ============================
   WATER
============================ */

function drawWater(){

 const gradient =

 ctx.createLinearGradient(
  0,
  0,
  0,
  H
 );


 gradient.addColorStop(
  0,
  "#28afd2"
 );


 gradient.addColorStop(
  1,
  "#08799f"
 );


 ctx.fillStyle =
 gradient;


 ctx.fillRect(
  0,
  0,
  W,
  H
 );



 ctx.strokeStyle =
 "rgba(255,255,255,.10)";


 ctx.lineWidth =
 1;


 const time =
 performance.now()
 /
 1000;



 for(
  let y=20;
  y<H;
  y+=30
 ){

  ctx.beginPath();


  for(
   let x=0;
   x<W;
   x+=35
  ){

   const waveY =

   y +

   Math.sin(
    x*0.035 +
    y*0.02 +
    time
   )
   *
   3;


   if(
    x===0
   ){

    ctx.moveTo(
     x,
     waveY
    );

   }else{

    ctx.lineTo(
     x,
     waveY
    );

   }

  }


  ctx.stroke();

 }

}



/* ============================
   TURN MARK
============================ */

function drawMark(x,y){

 ctx.save();


 ctx.translate(
  x,
  y
 );


 ctx.fillStyle =
 "#ffd21c";


 ctx.beginPath();


 ctx.arc(
  0,
  0,
  15,
  0,
  Math.PI*2
 );


 ctx.fill();


 ctx.strokeStyle =
 "white";


 ctx.lineWidth =
 3;


 ctx.stroke();


 ctx.fillStyle =
 "#e53935";


 ctx.beginPath();


 ctx.arc(
  0,
  0,
  6,
  0,
  Math.PI*2
 );


 ctx.fill();


 ctx.restore();

}



/* ============================
   COURSE
============================ */

function drawCourse(){

 const leftX =
 W * 0.30;


 const rightX =
 W * 0.70;


 const centerY =
 H * 0.50;



 /*
  2つのターンマーク
 */

 drawMark(
  leftX,
  centerY
 );


 drawMark(
  rightX,
  centerY
 );



 /*
  コース確認用ライン
 */

 ctx.strokeStyle =
 "rgba(255,255,255,.25)";


 ctx.lineWidth =
 2;


 ctx.setLineDash(
  [10,10]
 );


 ctx.beginPath();



 /*
  下

  左 → 右
 */

 ctx.moveTo(
  leftX,
  H*.76
 );


 ctx.lineTo(
  rightX,
  H*.76
 );



 /*
  右ターン
 */

 ctx.bezierCurveTo(

  W*.88,
  H*.76,

  W*.88,
  H*.24,

  rightX,
  H*.24

 );



 /*
  上

  右 → 左
 */

 ctx.lineTo(
  leftX,
  H*.24
 );



 /*
  左ターン
 */

 ctx.bezierCurveTo(

  W*.12,
  H*.24,

  W*.12,
  H*.76,

  leftX,
  H*.76

 );


 ctx.stroke();


 ctx.setLineDash(
  []
 );

}



/* ============================
   WAKE
============================ */

function drawWake(){

 const speed =
 Math.hypot(
  boat.vx,
  boat.vy
 );


 if(
  speed <
  10
 ){

  return;

 }


 const velocityAngle =
 Math.atan2(
  boat.vy,
  boat.vx
 );


 const backAngle =
 velocityAngle +
 Math.PI;


 const startX =

 boat.x +

 Math.cos(
  backAngle
 )
 *
 18;


 const startY =

 boat.y +

 Math.sin(
  backAngle
 )
 *
 18;


 const wakeLength =

 35 +

 clamp(
  speed/250,
  0,
  1
 )
 *
 70;


 ctx.strokeStyle =
 "rgba(255,255,255,.55)";


 ctx.lineWidth =
 3;



 for(
  const side
  of [-1,1]
 ){

  const sideAngle =

  backAngle +

  side *
  0.22;


  ctx.beginPath();


  ctx.moveTo(
   startX,
   startY
  );


  ctx.lineTo(

   startX +

   Math.cos(
    sideAngle
   )
   *
   wakeLength,

   startY +

   Math.sin(
    sideAngle
   )
   *
   wakeLength

  );


  ctx.stroke();

 }

}



/* ============================
   BOAT
============================ */

function drawBoat(){

 ctx.save();


 ctx.translate(
  boat.x,
  boat.y
 );


 ctx.rotate(
  boat.angle
 );



 /*
  船体
 */

 ctx.fillStyle =
 "#d81f3a";


 ctx.beginPath();


 /*
  船首
 */

 ctx.moveTo(
  30,
  0
 );


 /*
  左後ろ
 */

 ctx.lineTo(
  -16,
  -12
 );


 ctx.lineTo(
  -23,
  0
 );


 /*
  右後ろ
 */

 ctx.lineTo(
  -16,
  12
 );


 ctx.closePath();


 ctx.fill();



 /*
  白い船体部分
 */

 ctx.fillStyle =
 "white";


 ctx.beginPath();


 ctx.moveTo(
  18,
  0
 );


 ctx.lineTo(
  -7,
  -7
 );


 ctx.lineTo(
  -7,
  7
 );


 ctx.closePath();


 ctx.fill();



 /*
  操縦席
 */

 ctx.fillStyle =
 "#222";


 ctx.beginPath();


 ctx.arc(
  -5,
  0,
  4,
  0,
  Math.PI*2
 );


 ctx.fill();


 ctx.restore();

}



/* ============================
   LOOP
============================ */

function loop(time){

 const dt =

 Math.min(

  0.035,

  (
   time -
   previous
  )
  /
  1000

 );


 previous =
 time;



 physics(
  dt
 );


 drawWater();


 drawCourse();


 drawWake();


 drawBoat();



 requestAnimationFrame(
  loop
 );

}



requestAnimationFrame(
 loop
);

</script>

</body>
</html>
